<svg viewBox="0 0 540 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="540" height="380" fill="#f8fafc" rx="8"/>
  <text x="270" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Automation Cell Layout</text>
  <text x="270" y="38" text-anchor="middle" font-size="10" fill="#64748b">Top-down view of a typical robot workcell - fencing, stations, and safety zones</text>

  <!-- Cell boundary (safety fence) -->
  <rect x="40" y="50" width="380" height="280" rx="6" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="230" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Safety Fence / Guarding Perimeter</text>

  <!-- Floor area inside -->
  <rect x="46" y="72" width="368" height="252" rx="4" fill="#f1f5f9" opacity="0.7"/>

  <!-- Robot reach envelope (dashed circle) -->
  <circle cx="230" cy="200" r="110" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>
  <text x="302" y="112" font-size="9" fill="#b45309">Max reach envelope</text>

  <!-- Robot base -->
  <circle cx="230" cy="200" r="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="230" y="198" text-anchor="middle" font-size="9" font-weight="700" fill="white">ROBOT</text>
  <text x="230" y="209" text-anchor="middle" font-size="9" fill="#cbd5e1">BASE</text>

  <!-- PICK station (blue) -->
  <rect x="92" y="158" width="68" height="44" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="126" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="white">PICK</text>
  <text x="126" y="190" text-anchor="middle" font-size="9" fill="#eff6ff">Station A</text>
  <!-- Conveyor into PICK -->
  <line x1="48" y1="180" x2="84" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="84,176 84,184 92,180" fill="#64748b"/>
  <text x="69" y="161" text-anchor="middle" font-size="8" fill="#475569">Conveyor</text>
  <text x="69" y="171" text-anchor="middle" font-size="8" fill="#475569">in</text>

  <!-- PLACE station (green) -->
  <rect x="300" y="158" width="68" height="44" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="334" y="176" text-anchor="middle" font-size="10" font-weight="700" fill="white">PLACE</text>
  <text x="334" y="190" text-anchor="middle" font-size="9" fill="#f0fdf4">Station B</text>
  <!-- Conveyor out from PLACE -->
  <line x1="368" y1="180" x2="404" y2="180" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="404,176 404,184 412,180" fill="#64748b"/>
  <text x="391" y="161" text-anchor="middle" font-size="8" fill="#475569">Conveyor</text>
  <text x="391" y="171" text-anchor="middle" font-size="8" fill="#475569">out</text>

  <!-- TOOL stand (purple) -->
  <rect x="180" y="92" width="52" height="40" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="206" y="108" text-anchor="middle" font-size="9" font-weight="700" fill="white">TOOL</text>
  <text x="206" y="120" text-anchor="middle" font-size="9" fill="#ede9fe">Stand</text>

  <!-- HOME position marker -->
  <polygon points="230,145 223,158 237,158" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="243" y="156" font-size="9" fill="#c2410c">HOME</text>

  <!-- Control cabinet (grey) -->
  <rect x="72" y="262" width="76" height="46" rx="4" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="280" text-anchor="middle" font-size="9" font-weight="700" fill="white">CONTROL</text>
  <text x="110" y="292" text-anchor="middle" font-size="9" fill="#e2e8f0">CABINET</text>
  <text x="110" y="304" text-anchor="middle" font-size="8" fill="#cbd5e1">(computer + PSU)</text>

  <!-- HMI / Pendant (blue outline) -->
  <rect x="316" y="262" width="64" height="46" rx="4" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <text x="348" y="280" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">HMI /</text>
  <text x="348" y="292" text-anchor="middle" font-size="9" fill="#2563eb">PENDANT</text>
  <text x="348" y="304" text-anchor="middle" font-size="8" fill="#64748b">Operator</text>

  <!-- Access gate -->
  <rect x="196" y="326" width="68" height="4" rx="2" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
  <text x="230" y="345" text-anchor="middle" font-size="9" fill="#15803d">Access Gate (interlocked)</text>

  <!-- Legend -->
  <rect x="428" y="50" width="102" height="200" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="479" y="68" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
  <rect x="436" y="76" width="12" height="10" rx="2" fill="#2563eb"/>
  <text x="454" y="85" font-size="9" fill="#1e293b">Pick station</text>
  <rect x="436" y="94" width="12" height="10" rx="2" fill="#16a34a"/>
  <text x="454" y="103" font-size="9" fill="#1e293b">Place station</text>
  <rect x="436" y="112" width="12" height="10" rx="2" fill="#7c3aed"/>
  <text x="454" y="121" font-size="9" fill="#1e293b">Tool / fixture</text>
  <rect x="436" y="130" width="12" height="10" rx="2" fill="#1e293b"/>
  <text x="454" y="139" font-size="9" fill="#1e293b">Robot base</text>
  <line x1="436" y1="154" x2="448" y2="154" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="454" y="157" font-size="9" fill="#dc2626">Safety fence</text>
  <line x1="436" y1="172" x2="448" y2="172" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="454" y="175" font-size="9" fill="#b45309">Reach envelope</text>
  <polygon points="442,184 436,194 448,194" fill="#ea580c"/>
  <text x="454" y="193" font-size="9" fill="#c2410c">Home position</text>
  <rect x="436" y="203" width="12" height="10" rx="2" fill="#16a34a"/>
  <text x="454" y="211" font-size="9" fill="#15803d">Access gate</text>

  <text x="270" y="368" text-anchor="middle" font-size="9" fill="#64748b">All personnel must remain outside the fence when the robot is energised - access gate triggers E-Stop on open</text>
</svg>
