<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-b-start" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Joint Types</text>

  <!-- Divider -->
  <line x1="260" y1="50" x2="260" y2="270" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ===== REVOLUTE JOINT (left) ===== -->
  <text x="130" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">Revolute Joint</text>
  <text x="130" y="72" text-anchor="middle" font-size="10" fill="#64748b">Rotation about a fixed axis</text>
  <text x="130" y="84" text-anchor="middle" font-size="10" fill="#64748b">1 degree of freedom (DOF)</text>

  <!-- Fixed link -->
  <rect x="70" y="220" width="120" height="30" rx="5" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="white">Fixed Link</text>

  <!-- Ghost of the moving link rotated by θ = 30° about the pin -->
  <rect x="108" y="130" width="44" height="92" rx="8" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3" transform="rotate(30,130,220)"/>

  <!-- Moving link -->
  <rect x="108" y="130" width="44" height="92" rx="8" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="168" text-anchor="middle" font-size="10" fill="#1e3a8a" font-weight="600">Moving</text>
  <text x="130" y="181" text-anchor="middle" font-size="10" fill="#1e3a8a">Link</text>

  <!-- Axis pin (on top) -->
  <circle cx="130" cy="220" r="8" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <circle cx="130" cy="220" r="3" fill="#e2e8f0"/>

  <!-- Rotation arrow about the pin (radius 104, ±22°) -->
  <path d="M 91,123.6 A 104,104 0 0,1 169,123.6" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-start="url(#arr-b-start)" marker-end="url(#arr-b)"/>
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">θ</text>

  <!-- Range label -->
  <rect x="30" y="275" width="200" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="130" y="291" text-anchor="middle" font-size="10" fill="#1d4ed8">Typical range: 0° to 360°</text>
  <text x="130" y="305" text-anchor="middle" font-size="10" fill="#1d4ed8">Used in: all joints of this arm</text>

  <!-- ===== PRISMATIC JOINT (right) ===== -->
  <text x="390" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Prismatic Joint</text>
  <text x="390" y="72" text-anchor="middle" font-size="10" fill="#64748b">Linear sliding along an axis</text>
  <text x="390" y="84" text-anchor="middle" font-size="10" fill="#64748b">1 degree of freedom (DOF)</text>

  <!-- Guide rail (fixed) -->
  <rect x="350" y="115" width="80" height="150" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="362" y="120" width="56" height="140" rx="3" fill="#cbd5e1"/>
  <text x="342" y="128" text-anchor="end" font-size="10" fill="#475569">Fixed</text>
  <text x="342" y="141" text-anchor="end" font-size="10" fill="#475569">rail</text>

  <!-- Sliding block (at mid position) -->
  <rect x="345" y="165" width="90" height="50" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="188" text-anchor="middle" font-size="10" fill="#14532d" font-weight="600">Sliding</text>
  <text x="390" y="202" text-anchor="middle" font-size="10" fill="#14532d">Block</text>

  <!-- Slide arrows -->
  <line x1="448" y1="175" x2="448" y2="142" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <line x1="448" y1="205" x2="448" y2="238" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="458" y="194" font-size="12" fill="#15803d" font-weight="700">d</text>

  <!-- Range label -->
  <rect x="290" y="275" width="200" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="390" y="291" text-anchor="middle" font-size="10" fill="#166534">Typical range: 0 to 300 mm</text>
  <text x="390" y="305" text-anchor="middle" font-size="10" fill="#166534">Used in: SCARA arms, linear axes</text>

  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#64748b">This arm uses revolute joints only - SCARA and Cartesian robots add prismatic joints.</text>
</svg>
