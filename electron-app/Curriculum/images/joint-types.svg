<svg viewBox="0 0 520 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Joint Types</text>

  <!-- Divider -->
  <line x1="260" y1="50" x2="260" y2="320" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ===== REVOLUTE JOINT (left) ===== -->
  <text x="130" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#3b82f6">Revolute Joint</text>
  <text x="130" y="72" text-anchor="middle" font-size="10" fill="#64748b">Rotation about a fixed axis</text>
  <text x="130" y="84" text-anchor="middle" font-size="10" fill="#64748b">1 degree of freedom (DOF)</text>

  <!-- Fixed link below -->
  <rect x="70" y="220" width="120" height="30" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="240" text-anchor="middle" font-size="10" fill="white">Fixed Link</text>

  <!-- Axis pin -->
  <circle cx="130" cy="220" r="8" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <circle cx="130" cy="220" r="3" fill="#e2e8f0"/>

  <!-- Rotating link (shown at ~30° rotated) -->
  <rect x="118" y="130" width="24" height="92" rx="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="175" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">Moving</text>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#1d4ed8">Link</text>

  <!-- Rotation arc arrows -->
  <path d="M 162,195 A 38,38 0 0,1 155,162" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 98,195 A 38,38 0 0,0 105,162" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="178" y="178" font-size="11" fill="#3b82f6" font-weight="700">θ</text>

  <!-- Range label -->
  <rect x="30" y="275" width="200" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="130" y="291" text-anchor="middle" font-size="10" fill="#1d4ed8">Typical range: 0° to 360°</text>
  <text x="130" y="305" text-anchor="middle" font-size="10" fill="#1d4ed8">Used in: all joints of this arm</text>

  <!-- ===== PRISMATIC JOINT (right) ===== -->
  <text x="390" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Prismatic Joint</text>
  <text x="390" y="72" text-anchor="middle" font-size="10" fill="#64748b">Linear sliding along an axis</text>
  <text x="390" y="84" text-anchor="middle" font-size="10" fill="#64748b">1 degree of freedom (DOF)</text>

  <!-- Guide rail (fixed) -->
  <rect x="350" y="115" width="80" height="160" rx="5" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="362" y="120" width="56" height="150" rx="3" fill="#cbd5e1"/>
  <text x="390" y="305" text-anchor="middle" font-size="10" fill="#64748b">Fixed Rail</text>

  <!-- Sliding block (at mid position) -->
  <rect x="345" y="175" width="90" height="50" rx="6" fill="#86efac" stroke="#16a34a" stroke-width="2.5"/>
  <text x="390" y="198" text-anchor="middle" font-size="10" fill="#14532d" font-weight="600">Sliding</text>
  <text x="390" y="212" text-anchor="middle" font-size="10" fill="#14532d">Block</text>

  <!-- Slide arrows -->
  <line x1="445" y1="185" x2="445" y2="155" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="445" y1="215" x2="445" y2="245" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="458" y="202" font-size="12" fill="#16a34a" font-weight="700">d</text>

  <!-- Range label -->
  <rect x="290" y="275" width="200" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="390" y="291" text-anchor="middle" font-size="10" fill="#166534">Typical range: 0 to 300 mm</text>
  <text x="390" y="305" text-anchor="middle" font-size="10" fill="#166534">Used in: SCARA arms, linear axes</text>

  <!-- Note at bottom -->
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#64748b">This arm uses revolute joints only. SCARA and Cartesian robots use a mix of revolute and prismatic joints.</text>
</svg>
