<svg viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#ef4444"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="540" height="400" fill="#f8fafc" rx="8"/>
  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Coordinate Frames — Robot Arm</text>
  <text x="270" y="40" text-anchor="middle" font-size="11" fill="#64748b">Each joint has its own local frame. FK chains them together to find the end-effector in the world frame.</text>

  <!-- World / Base frame at bottom -->
  <circle cx="160" cy="340" r="7" fill="#1e293b"/>
  <!-- X -->
  <line x1="160" y1="340" x2="230" y2="340" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <text x="236" y="344" font-size="12" fill="#ef4444" font-weight="700">X</text>
  <!-- Y -->
  <line x1="160" y1="340" x2="160" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="150" y="270" font-size="12" fill="#16a34a" font-weight="700">Y</text>
  <!-- Z (out of page) -->
  <line x1="160" y1="340" x2="132" y2="312" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <text x="121" y="308" font-size="12" fill="#3b82f6" font-weight="700">Z</text>
  <text x="160" y="362" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">Frame 0</text>
  <text x="160" y="375" text-anchor="middle" font-size="10" fill="#64748b">(World / Base)</text>

  <!-- Arm links -->
  <!-- Link 1: base to shoulder -->
  <rect x="152" y="240" width="16" height="102" rx="5" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Frame 1 at shoulder joint -->
  <circle cx="160" cy="240" r="7" fill="#3b82f6"/>
  <line x1="160" y1="240" x2="215" y2="240" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="220" y="244" font-size="11" fill="#ef4444">x₁</text>
  <line x1="160" y1="240" x2="160" y2="190" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="150" y="186" font-size="11" fill="#16a34a">y₁</text>
  <text x="185" y="258" font-size="11" fill="#3b82f6" font-weight="700">Frame 1</text>
  <text x="185" y="270" font-size="10" fill="#64748b">(Shoulder)</text>
  <text x="185" y="282" font-size="9" fill="#64748b">rotated by θ₁</text>

  <!-- Link 2: shoulder to elbow (angled) -->
  <g transform="rotate(-30,160,240)">
    <rect x="152" y="148" width="16" height="94" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
  </g>

  <!-- Frame 2 at elbow -->
  <circle cx="136" cy="159" r="7" fill="#7c3aed"/>
  <line x1="136" y1="159" x2="186" y2="143" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="190" y="140" font-size="11" fill="#ef4444">x₂</text>
  <line x1="136" y1="159" x2="120" y2="112" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="108" y="108" font-size="11" fill="#16a34a">y₂</text>
  <text x="86" y="175" font-size="11" fill="#7c3aed" font-weight="700">Frame 2</text>
  <text x="86" y="187" font-size="10" fill="#64748b">(Elbow)</text>
  <text x="86" y="199" font-size="9" fill="#64748b">rotated by θ₁+θ₂</text>

  <!-- Link 3: elbow to wrist -->
  <g transform="rotate(-10,136,159)">
    <rect x="128" y="80" width="16" height="80" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Frame 3 at wrist (end-effector) -->
  <circle cx="128" cy="82" r="7" fill="#ea580c"/>
  <line x1="128" y1="82" x2="178" y2="72" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="182" y="70" font-size="11" fill="#ef4444">x₃</text>
  <line x1="128" y1="82" x2="118" y2="38" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="106" y="34" font-size="11" fill="#16a34a">y₃</text>
  <text x="80" y="98" font-size="11" fill="#ea580c" font-weight="700">Frame 3</text>
  <text x="80" y="110" font-size="10" fill="#64748b">(End-Effector)</text>

  <!-- Right side explanation -->
  <rect x="330" y="60" width="190" height="260" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="425" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Frame Chaining</text>
  <text x="340" y="102" font-size="10" fill="#64748b">Each frame is defined by a</text>
  <text x="340" y="116" font-size="10" fill="#64748b">4×4 transformation matrix T</text>
  <text x="340" y="130" font-size="10" fill="#64748b">relative to the previous frame.</text>

  <rect x="340" y="140" width="170" height="20" rx="4" fill="#eff6ff"/>
  <text x="425" y="154" text-anchor="middle" font-size="10" fill="#1d4ed8" font-family="monospace">T_total = T₀₁ × T₁₂ × T₂₃</text>

  <text x="340" y="180" font-size="10" fill="#64748b">The result gives the end-</text>
  <text x="340" y="194" font-size="10" fill="#64748b">effector position (x,y,z) and</text>
  <text x="340" y="208" font-size="10" fill="#64748b">orientation in world frame.</text>

  <text x="340" y="234" font-size="10" fill="#64748b">Key insight: rotating Frame 1</text>
  <text x="340" y="248" font-size="10" fill="#64748b">by θ₁ moves ALL frames</text>
  <text x="340" y="262" font-size="10" fill="#64748b">downstream with it — just</text>
  <text x="340" y="276" font-size="10" fill="#64748b">like a real robot arm joint.</text>

  <text x="270" y="392" text-anchor="middle" font-size="10" fill="#64748b">The Kinematics tab in the app shows the result of this chain calculation for any set of joint angles</text>
</svg>
