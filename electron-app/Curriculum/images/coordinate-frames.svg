<svg viewBox="0 0 540 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#ef4444"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/></marker>
  </defs>
  <rect width="540" height="410" fill="#f8fafc" rx="8"/>
  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Coordinate Frames - Robot Arm</text>
  <text x="270" y="40" text-anchor="middle" font-size="11" fill="#64748b">Each joint has its own local frame - forward kinematics chains them together</text>

  <!-- Geometry: Frame 0 (160,345) → Link 1 (95, vertical) → Frame 1 (160,250) → Link 2 (85, 30° left)
       → Frame 2 (117.5,176.4) → Link 3 (75, 20° right) → Frame 3 (143.2,105.9). Frame axes rotate with the links. -->

  <!-- Links (drawn first so the frame axes sit on top) -->
  <rect x="152" y="250" width="16" height="95" rx="5" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="152" y="165" width="16" height="85" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5" transform="rotate(-30,160,250)"/>
  <rect x="109.5" y="101.4" width="16" height="75" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5" transform="rotate(20,117.5,176.4)"/>

  <!-- Frame 0 (world / base) -->
  <line x1="160" y1="345" x2="225" y2="345" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <line x1="160" y1="345" x2="160" y2="288" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <line x1="160" y1="345" x2="136" y2="321" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <circle cx="160" cy="345" r="7" fill="#1e293b"/>
  <text x="233" y="349" font-size="12" fill="#ef4444" font-weight="700">X</text>
  <text x="150" y="294" text-anchor="end" font-size="12" fill="#16a34a" font-weight="700">Y</text>
  <text x="130" y="320" text-anchor="end" font-size="12" fill="#3b82f6" font-weight="700">Z</text>
  <text x="160" y="368" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="700">Frame 0</text>
  <text x="160" y="381" text-anchor="middle" font-size="10" fill="#64748b">(World / Base)</text>

  <!-- Frame 1 (shoulder), aligned with frame 0 -->
  <line x1="160" y1="250" x2="205" y2="250" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="160" y1="250" x2="160" y2="207" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <circle cx="160" cy="250" r="6" fill="#3b82f6"/>
  <text x="211" y="254" font-size="11" fill="#ef4444">x₁</text>
  <text x="166" y="210" font-size="11" fill="#16a34a">y₁</text>
  <text x="176" y="270" font-size="11" fill="#2563eb" font-weight="700">Frame 1</text>
  <text x="176" y="283" font-size="10" fill="#64748b">(Shoulder)</text>
  <text x="176" y="295" font-size="9" fill="#64748b">rotated by θ₁</text>

  <!-- Frame 2 (elbow), rotated 30° with link 2 -->
  <line x1="117.5" y1="176.4" x2="156.5" y2="153.9" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="117.5" y1="176.4" x2="95" y2="137.4" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <circle cx="117.5" cy="176.4" r="6" fill="#7c3aed"/>
  <text x="162" y="155" font-size="11" fill="#ef4444">x₂</text>
  <text x="89" y="140" text-anchor="end" font-size="11" fill="#16a34a">y₂</text>
  <text x="104" y="186" text-anchor="end" font-size="11" fill="#7c3aed" font-weight="700">Frame 2</text>
  <text x="104" y="199" text-anchor="end" font-size="10" fill="#64748b">(Elbow)</text>
  <text x="104" y="211" text-anchor="end" font-size="9" fill="#64748b">rotated by θ₁+θ₂</text>

  <!-- Frame 3 (end-effector), rotated 10° (30° - 20°) -->
  <line x1="143.2" y1="105.9" x2="187.5" y2="98.1" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <line x1="143.2" y1="105.9" x2="135.4" y2="61.6" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <circle cx="143.2" cy="105.9" r="6" fill="#ea580c"/>
  <text x="193" y="100" font-size="11" fill="#ef4444">x₃</text>
  <text x="141" y="62" font-size="11" fill="#16a34a">y₃</text>
  <text x="128" y="100" text-anchor="end" font-size="11" fill="#c2410c" font-weight="700">Frame 3</text>
  <text x="128" y="113" text-anchor="end" font-size="10" fill="#64748b">(End-Effector)</text>

  <!-- Right side explanation -->
  <rect x="330" y="60" width="190" height="260" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="425" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Frame Chaining</text>
  <text x="340" y="102" font-size="10" fill="#64748b">Each frame is defined by a</text>
  <text x="340" y="116" font-size="10" fill="#64748b">4×4 transformation matrix T</text>
  <text x="340" y="130" font-size="10" fill="#64748b">relative to the previous frame.</text>

  <rect x="340" y="140" width="170" height="20" rx="4" fill="#eff6ff"/>
  <text x="425" y="154" text-anchor="middle" font-size="10" fill="#1d4ed8" font-family="monospace">T_total = T₀₁ × T₁₂ × T₂₃</text>

  <text x="340" y="180" font-size="10" fill="#64748b">The result gives the end-</text>
  <text x="340" y="194" font-size="10" fill="#64748b">effector position (x,y,z) and</text>
  <text x="340" y="208" font-size="10" fill="#64748b">orientation in world frame.</text>

  <text x="340" y="234" font-size="10" fill="#64748b">Key insight: rotating Frame 1</text>
  <text x="340" y="248" font-size="10" fill="#64748b">by θ₁ moves ALL frames</text>
  <text x="340" y="262" font-size="10" fill="#64748b">downstream with it - just</text>
  <text x="340" y="276" font-size="10" fill="#64748b">like a real robot arm joint.</text>

  <text x="270" y="402" text-anchor="middle" font-size="10" fill="#64748b">The Kinematics tab in the app shows the result of this chain calculation for any set of joint angles</text>
</svg>
