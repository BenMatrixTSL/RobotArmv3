<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#f8fafc" rx="8"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Kinetic Energy vs Speed</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#64748b">KE = ½mv² — doubling speed quadruples impact energy</text>

  <!-- Chart area -->
  <rect x="70" y="55" width="420" height="260" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Grid -->
  <line x1="70" y1="120" x2="490" y2="120" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="70" y1="185" x2="490" y2="185" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="70" y1="250" x2="490" y2="250" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="175" y1="55" x2="175" y2="315" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="280" y1="55" x2="280" y2="315" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="385" y1="55" x2="385" y2="315" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Axes -->
  <line x1="70" y1="315" x2="490" y2="315" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="70" y1="315" x2="70" y2="55" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- X axis labels (speed) -->
  <text x="70"  y="330" text-anchor="middle" font-size="10" fill="#64748b">0</text>
  <text x="175" y="330" text-anchor="middle" font-size="10" fill="#64748b">25%</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#64748b">50%</text>
  <text x="385" y="330" text-anchor="middle" font-size="10" fill="#64748b">75%</text>
  <text x="490" y="330" text-anchor="middle" font-size="10" fill="#64748b">100%</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#64748b">Speed Setting</text>

  <!-- Y axis labels (KE) -->
  <text x="62" y="315" text-anchor="end" font-size="10" fill="#64748b">0</text>
  <text x="62" y="250" text-anchor="end" font-size="10" fill="#64748b">25%</text>
  <text x="62" y="185" text-anchor="end" font-size="10" fill="#64748b">50%</text>
  <text x="62" y="120" text-anchor="end" font-size="10" fill="#64748b">75%</text>
  <text x="62" y="70" text-anchor="end" font-size="10" fill="#64748b">100%</text>
  <text x="20" y="185" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,20,185)">Kinetic Energy (impact)</text>

  <!-- KE = v² curve (quadratic) -->
  <!-- Points: speed=0→KE=0, 25→6.25, 50→25, 75→56.25, 100→100 -->
  <!-- Map: speed% to x: 0→70, 25→175, 50→280, 75→385, 100→490 -->
  <!-- Map: KE% to y: 0→315, 25→250, 50→185, 75→120, 100→55 -->
  <!-- Points: (70,315), (175,298), (280,250), (385,168), (490,55) -->
  <path d="M 70,315 Q 175,310 280,250 Q 385,185 490,55" stroke="#ef4444" stroke-width="3" fill="none"/>

  <!-- Shading under curve -->
  <path d="M 70,315 Q 175,310 280,250 Q 385,185 490,55 L 490,315 Z" fill="#fef2f2" fill-opacity="0.6"/>

  <!-- Key speed markers -->
  <!-- 50% speed: x=280, KE=25% → y=250 -->
  <circle cx="280" cy="250" r="6" fill="#f59e0b" stroke="white" stroke-width="1.5"/>
  <line x1="280" y1="250" x2="280" y2="315" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="70"  y1="250" x2="280" y2="250" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="285" y="244" font-size="9" fill="#f59e0b" font-weight="700">50% speed</text>
  <text x="285" y="255" font-size="9" fill="#f59e0b">= 25% KE</text>

  <!-- 100% speed -->
  <circle cx="490" cy="55" r="6" fill="#ef4444" stroke="white" stroke-width="1.5"/>
  <line x1="70"  y1="55"  x2="490" y2="55"  stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="494" y="59" font-size="9" fill="#ef4444" font-weight="700">100% speed</text>
  <text x="494" y="70" font-size="9" fill="#ef4444">= 100% KE</text>

  <!-- Double arrow annotation -->
  <line x1="395" y1="55" x2="395" y2="250" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="395,55 390,68 400,68" fill="#1d4ed8"/>
  <polygon points="395,250 390,237 400,237" fill="#1d4ed8"/>
  <text x="410" y="155" font-size="10" fill="#1d4ed8" font-weight="700">4×</text>
  <text x="408" y="167" font-size="9" fill="#1d4ed8">more</text>
  <text x="408" y="179" font-size="9" fill="#1d4ed8">energy!</text>

  <!-- Formula -->
  <rect x="80" y="65" width="160" height="50" rx="6" fill="#0f172a"/>
  <text x="160" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#7dd3fc">KE = ½ × m × v²</text>
  <text x="160" y="102" text-anchor="middle" font-size="10" fill="#93c5fd">Speed doubles → KE × 4</text>

  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#64748b">Operating at 50% speed reduces collision energy to just 25% — a significant safety improvement</text>
</svg>
