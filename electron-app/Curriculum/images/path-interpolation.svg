<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="560" height="380" fill="#f8fafc" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Path Interpolation Types</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#64748b">Three ways to move between two points — same start &amp; end, different paths</text>

  <!-- === JOINT INTERPOLATION === -->
  <text x="93" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#3b82f6">Joint Interpolation</text>
  <text x="93" y="86" text-anchor="middle" font-size="9" fill="#64748b">Each joint moves at its own rate</text>
  <text x="93" y="98" text-anchor="middle" font-size="9" fill="#64748b">End-effector takes curved path</text>

  <!-- Start point -->
  <circle cx="40" cy="240" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="40" y="258" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <!-- End point -->
  <circle cx="146" cy="150" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="146" y="168" text-anchor="middle" font-size="10" fill="#991b1b">End</text>
  <!-- Curved joint-space path -->
  <path d="M 40,240 Q 30,180 80,160 Q 120,145 146,150" stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="6,3"/>
  <text x="55" y="185" font-size="9" fill="#3b82f6">curved</text>
  <text x="55" y="196" font-size="9" fill="#3b82f6">path</text>

  <!-- Grid lines -->
  <line x1="20" y1="250" x2="170" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="140" x2="170" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="140" x2="20" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <text x="12" y="254" text-anchor="end" font-size="9" fill="#94a3b8">Y</text>
  <text x="172" y="254" font-size="9" fill="#94a3b8">X</text>

  <!-- Pro/con -->
  <rect x="20" y="285" width="146" height="50" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="93" y="300" text-anchor="middle" font-size="9" fill="#1d4ed8">✓ Fast, computationally simple</text>
  <text x="93" y="313" text-anchor="middle" font-size="9" fill="#1d4ed8">✓ Each joint at max efficiency</text>
  <text x="93" y="326" text-anchor="middle" font-size="9" fill="#dc2626">✗ End-effector path unpredictable</text>

  <!-- === LINEAR INTERPOLATION === -->
  <text x="280" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Linear Interpolation</text>
  <text x="280" y="86" text-anchor="middle" font-size="9" fill="#64748b">Straight line in Cartesian space</text>
  <text x="280" y="98" text-anchor="middle" font-size="9" fill="#64748b">Joints coordinated to achieve it</text>

  <!-- Axes -->
  <line x1="207" y1="140" x2="207" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="207" y1="250" x2="357" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="207" y1="140" x2="357" y2="140" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Start/End -->
  <circle cx="227" cy="240" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="227" y="258" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <circle cx="333" cy="150" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="333" y="168" text-anchor="middle" font-size="10" fill="#991b1b">End</text>

  <!-- Straight line path -->
  <line x1="227" y1="240" x2="333" y2="150" stroke="#16a34a" stroke-width="3"/>
  <text x="265" y="205" text-anchor="middle" font-size="9" fill="#166534">straight</text>
  <text x="265" y="216" text-anchor="middle" font-size="9" fill="#166534">line</text>

  <!-- Pro/con -->
  <rect x="207" y="285" width="146" height="50" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="280" y="300" text-anchor="middle" font-size="9" fill="#166534">✓ Predictable Cartesian path</text>
  <text x="280" y="313" text-anchor="middle" font-size="9" fill="#166534">✓ Avoids obstacles reliably</text>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#dc2626">✗ Slower, more computation</text>

  <!-- === CIRCULAR INTERPOLATION === -->
  <text x="467" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Circular Interpolation</text>
  <text x="467" y="86" text-anchor="middle" font-size="9" fill="#64748b">Arc path through a via-point</text>
  <text x="467" y="98" text-anchor="middle" font-size="9" fill="#64748b">Used for rounded motions</text>

  <!-- Axes -->
  <line x1="394" y1="140" x2="394" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="394" y1="250" x2="544" y2="250" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="394" y1="140" x2="544" y2="140" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Start/End -->
  <circle cx="414" cy="240" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="414" y="258" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <circle cx="520" cy="150" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="520" y="168" text-anchor="middle" font-size="10" fill="#991b1b">End</text>

  <!-- Via point -->
  <circle cx="515" cy="235" r="5" fill="#7c3aed"/>
  <text x="530" y="238" font-size="9" fill="#7c3aed">via</text>

  <!-- Arc -->
  <path d="M 414,240 Q 515,275 515,235 Q 515,175 520,150" stroke="#7c3aed" stroke-width="3" fill="none"/>

  <!-- Pro/con -->
  <rect x="394" y="285" width="146" height="50" rx="5" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="467" y="300" text-anchor="middle" font-size="9" fill="#6d28d9">✓ Smooth curved paths</text>
  <text x="467" y="313" text-anchor="middle" font-size="9" fill="#6d28d9">✓ Ideal for sealing/welding arcs</text>
  <text x="467" y="326" text-anchor="middle" font-size="9" fill="#dc2626">✗ Requires 3 points defined</text>

  <!-- Separator lines -->
  <line x1="186" y1="60" x2="186" y2="355" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="373" y1="60" x2="373" y2="355" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
