<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="560" height="360" fill="#f8fafc" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Path Interpolation Types</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#64748b">Three ways to move between two points - same start &amp; end, different paths</text>

  <!-- Separator lines -->
  <line x1="186" y1="60" x2="186" y2="345" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="373" y1="60" x2="373" y2="345" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Each panel: plot x ox..ox+146, y 116..262; Start (ox+22,230), End (ox+126,140) -->

  <!-- === JOINT INTERPOLATION (ox = 20) === -->
  <text x="93" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Joint Interpolation</text>
  <text x="93" y="86" text-anchor="middle" font-size="9" fill="#64748b">Each joint moves at its own rate</text>
  <text x="93" y="98" text-anchor="middle" font-size="9" fill="#64748b">End-effector takes a curved path</text>
  <rect x="20" y="116" width="146" height="146" fill="white"/>
  <polyline points="20,116 20,262 166,262" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="14" y="124" text-anchor="end" font-size="9" fill="#64748b">Y</text>
  <text x="166" y="274" text-anchor="end" font-size="9" fill="#64748b">X</text>
  <path d="M 42,230 C 36,170 80,140 146,140" stroke="#3b82f6" stroke-width="3" fill="none" stroke-dasharray="6,3"/>
  <text x="96" y="190" font-size="9" fill="#2563eb">curved</text>
  <text x="96" y="201" font-size="9" fill="#2563eb">path</text>
  <circle cx="42" cy="230" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="42" y="251" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <circle cx="146" cy="140" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="146" y="128" text-anchor="middle" font-size="10" fill="#991b1b">End</text>
  <rect x="14" y="282" width="166" height="50" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="97" y="297" text-anchor="middle" font-size="9" fill="#1d4ed8">✓ Fast, computationally simple</text>
  <text x="97" y="310" text-anchor="middle" font-size="9" fill="#1d4ed8">✓ Each joint at max efficiency</text>
  <text x="97" y="323" text-anchor="middle" font-size="9" fill="#dc2626">✗ Tool path hard to predict</text>

  <!-- === LINEAR INTERPOLATION (ox = 207) === -->
  <text x="280" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Linear Interpolation</text>
  <text x="280" y="86" text-anchor="middle" font-size="9" fill="#64748b">Straight line in Cartesian space</text>
  <text x="280" y="98" text-anchor="middle" font-size="9" fill="#64748b">Joints coordinated to achieve it</text>
  <rect x="207" y="116" width="146" height="146" fill="white"/>
  <polyline points="207,116 207,262 353,262" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="201" y="124" text-anchor="end" font-size="9" fill="#64748b">Y</text>
  <text x="353" y="274" text-anchor="end" font-size="9" fill="#64748b">X</text>
  <line x1="229" y1="230" x2="333" y2="140" stroke="#16a34a" stroke-width="3"/>
  <text x="304" y="210" text-anchor="middle" font-size="9" fill="#166534">straight line</text>
  <circle cx="229" cy="230" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="229" y="251" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <circle cx="333" cy="140" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="333" y="128" text-anchor="middle" font-size="10" fill="#991b1b">End</text>
  <rect x="201" y="282" width="166" height="50" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="284" y="297" text-anchor="middle" font-size="9" fill="#166534">✓ Predictable Cartesian path</text>
  <text x="284" y="310" text-anchor="middle" font-size="9" fill="#166534">✓ Avoids obstacles reliably</text>
  <text x="284" y="323" text-anchor="middle" font-size="9" fill="#dc2626">✗ Slower, more computation</text>

  <!-- === CIRCULAR INTERPOLATION (ox = 394) === -->
  <text x="467" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Circular Interpolation</text>
  <text x="467" y="86" text-anchor="middle" font-size="9" fill="#64748b">Arc path through a via-point</text>
  <text x="467" y="98" text-anchor="middle" font-size="9" fill="#64748b">Used for rounded motions</text>
  <rect x="394" y="116" width="146" height="146" fill="white"/>
  <polyline points="394,116 394,262 540,262" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="388" y="124" text-anchor="end" font-size="9" fill="#64748b">Y</text>
  <text x="540" y="274" text-anchor="end" font-size="9" fill="#64748b">X</text>
  <!-- True circular arc: centre (423,133), radius 97.1, passing through the via point -->
  <path d="M 416,230 A 97.1,97.1 0 0,0 520,140" stroke="#7c3aed" stroke-width="3" fill="none"/>
  <circle cx="486.6" cy="206.4" r="5" fill="#7c3aed" stroke="white" stroke-width="1.5"/>
  <text x="496" y="218" font-size="9" fill="#6d28d9">via</text>
  <circle cx="416" cy="230" r="7" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="416" y="251" text-anchor="middle" font-size="10" fill="#166534">Start</text>
  <circle cx="520" cy="140" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="520" y="128" text-anchor="middle" font-size="10" fill="#991b1b">End</text>
  <rect x="388" y="282" width="166" height="50" rx="5" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="471" y="297" text-anchor="middle" font-size="9" fill="#6d28d9">✓ Smooth curved paths</text>
  <text x="471" y="310" text-anchor="middle" font-size="9" fill="#6d28d9">✓ Ideal for sealing/welding arcs</text>
  <text x="471" y="323" text-anchor="middle" font-size="9" fill="#dc2626">✗ Needs 3 points defined</text>
</svg>
