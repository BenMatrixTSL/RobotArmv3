<svg viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#f8fafc" rx="8"/>
  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Full System Architecture</text>
  <text x="310" y="38" text-anchor="middle" font-size="10" fill="#64748b">Hardware and software components with communication protocols</text>

  <!-- ── LAYER 1: User / HMI ── -->
  <rect x="20" y="52" width="580" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="30" y="68" font-size="10" font-weight="700" fill="#1d4ed8">Layer 1 - User Interface (HMI)</text>
  <rect x="40" y="74" width="130" height="40" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="white">Electron App</text>
  <text x="105" y="104" text-anchor="middle" font-size="8.5" fill="#eff6ff">PC or arm touchscreen</text>
  <g font-size="9" text-anchor="middle">
    <rect x="190" y="74" width="90" height="40" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
    <text x="235" y="91" fill="#1e293b">Pendant</text>
    <text x="235" y="104" font-size="8.5" fill="#334155">tab</text>
    <rect x="290" y="74" width="90" height="40" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
    <text x="335" y="91" fill="#1e293b">Blockly</text>
    <text x="335" y="104" font-size="8.5" fill="#334155">tab</text>
    <rect x="390" y="74" width="100" height="40" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
    <text x="440" y="91" fill="#1e293b">Joint Control</text>
    <text x="440" y="104" font-size="8.5" fill="#334155">tab</text>
    <rect x="500" y="74" width="90" height="40" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
    <text x="545" y="91" fill="#1e293b">Telemetry</text>
    <text x="545" y="104" font-size="8.5" fill="#334155">tab</text>
  </g>

  <!-- ── Link 1: WebSocket (commands down, status back up) ── -->
  <line x1="300" y1="126" x2="300" y2="148" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="312" y="140.5" font-size="9" font-weight="700" fill="#475569">WebSocket · JSON · TCP :8080</text>

  <!-- ── LAYER 2: Onboard computer ── -->
  <rect x="20" y="152" width="580" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="30" y="168" font-size="10" font-weight="700" fill="#15803d">Layer 2 - Onboard Computer (Controller)</text>
  <rect x="40" y="174" width="130" height="58" rx="6" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="105" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="white">Onboard computer</text>
  <text x="105" y="211" text-anchor="middle" font-size="8.5" fill="#f0fdf4">Node.js</text>
  <text x="105" y="223" text-anchor="middle" font-size="8.5" fill="#f0fdf4">WebSocket server</text>
  <g text-anchor="middle">
    <rect x="190" y="174" width="120" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="250" y="193" font-size="9" font-weight="600" fill="#1e293b">server.js</text>
    <text x="250" y="207" font-size="8.5" fill="#475569">Command routing /</text>
    <text x="250" y="219" font-size="8.5" fill="#475569">control session</text>
    <rect x="320" y="174" width="120" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="380" y="193" font-size="9" font-weight="600" fill="#1e293b">servoWorker.js</text>
    <text x="380" y="207" font-size="8.5" fill="#475569">Owns the serial port /</text>
    <text x="380" y="219" font-size="8.5" fill="#475569">polls servo status</text>
    <rect x="450" y="174" width="130" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="515" y="193" font-size="9" font-weight="600" fill="#1e293b">robotArmST3215.js</text>
    <text x="515" y="207" font-size="8.5" fill="#475569">ST3215 protocol /</text>
    <text x="515" y="219" font-size="8.5" fill="#475569">packet builder</text>
  </g>

  <!-- ── Link 2: UART ── -->
  <line x1="300" y1="246" x2="300" y2="268" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="312" y="260.5" font-size="9" font-weight="700" fill="#475569">UART serial · 1 Mbaud · half-duplex bus</text>

  <!-- ── LAYER 3: Hardware ── -->
  <rect x="20" y="272" width="580" height="120" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="30" y="288" font-size="10" font-weight="700" fill="#6d28d9">Layer 3 - Hardware</text>

  <!-- Daisy-chained servo bus (behind the servo boxes) -->
  <line x1="61" y1="340" x2="381" y2="340" stroke="#94a3b8" stroke-width="2"/>

  <!-- Six ST3215 servos, IDs 1-6 -->
  <g text-anchor="middle">
    <rect x="32"  y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="61"  y="318" font-size="10" font-weight="700" fill="white">ID 1</text>
    <text x="61"  y="336" font-size="8.5" fill="#f5f3ff">J1</text>
    <text x="61"  y="348" font-size="8.5" fill="#f5f3ff">Base</text>
    <text x="61"  y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <rect x="96"  y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="125" y="318" font-size="10" font-weight="700" fill="white">ID 2</text>
    <text x="125" y="336" font-size="8.5" fill="#f5f3ff">J2</text>
    <text x="125" y="348" font-size="8.5" fill="#f5f3ff">Shoulder</text>
    <text x="125" y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <rect x="160" y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="189" y="318" font-size="10" font-weight="700" fill="white">ID 3</text>
    <text x="189" y="336" font-size="8.5" fill="#f5f3ff">J3</text>
    <text x="189" y="348" font-size="8.5" fill="#f5f3ff">Elbow</text>
    <text x="189" y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <rect x="224" y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="253" y="318" font-size="10" font-weight="700" fill="white">ID 4</text>
    <text x="253" y="336" font-size="8.5" fill="#f5f3ff">J4</text>
    <text x="253" y="348" font-size="8.5" fill="#f5f3ff">Wrist</text>
    <text x="253" y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <rect x="288" y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="317" y="318" font-size="10" font-weight="700" fill="white">ID 5</text>
    <text x="317" y="336" font-size="8.5" fill="#f5f3ff">J5</text>
    <text x="317" y="348" font-size="8.5" fill="#f5f3ff">Wrist pitch</text>
    <text x="317" y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <rect x="352" y="298" width="58" height="84" rx="6" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="381" y="318" font-size="10" font-weight="700" fill="white">ID 6</text>
    <text x="381" y="336" font-size="8.5" fill="#f5f3ff">J6</text>
    <text x="381" y="348" font-size="8.5" fill="#f5f3ff">Wrist roll</text>
    <text x="381" y="370" font-size="8" fill="#ddd6fe">ST3215</text>

    <!-- PSU -->
    <rect x="422" y="298" width="80" height="84" rx="6" fill="#c2410c" stroke="#9a3412" stroke-width="1.5"/>
    <text x="462" y="318" font-size="10" font-weight="700" fill="white">PSU</text>
    <text x="462" y="333" font-size="8.5" fill="#fff7ed">Mains → 24 V DC</text>
    <text x="462" y="349" font-size="8" fill="#ffedd5">Power PCB:</text>
    <text x="462" y="361" font-size="8.5" fill="#fff7ed">12 V → servos</text>
    <text x="462" y="373" font-size="8.5" fill="#fff7ed">5 V → computer</text>

    <!-- E-STOP -->
    <rect x="512" y="298" width="76" height="84" rx="6" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
    <text x="550" y="318" font-size="10" font-weight="700" fill="white">E-STOP</text>
    <text x="550" y="336" font-size="8.5" fill="#fef2f2">Cuts the</text>
    <text x="550" y="349" font-size="8.5" fill="#fef2f2">servo supply</text>
    <text x="550" y="373" font-size="8" fill="#fecaca">HW override</text>
  </g>

  <!-- ── Notes ── -->
  <text x="310" y="410" text-anchor="middle" font-size="9" fill="#64748b">Double-headed arrows: commands go down, status and telemetry come back up the same link.</text>
  <text x="310" y="424" text-anchor="middle" font-size="9" fill="#64748b">Encoder feedback returns in servo status packets over the UART bus. E-Stop is hardware-level and overrides software.</text>
</svg>
