<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#f8fafc" rx="8"/>

  <!-- Title / instruction area -->
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">System Block Diagram Template</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#64748b">Add your components in the boxes — draw arrows to show signal and data flow</text>

  <!-- Grid guide lines (light) -->
  <line x1="20"  y1="55"  x2="540" y2="55"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="20"  y1="155" x2="540" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="20"  y1="255" x2="540" y2="255" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="20"  y1="355" x2="540" y2="355" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="150" y1="55"  x2="150" y2="355" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="280" y1="55"  x2="280" y2="355" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="410" y1="55"  x2="410" y2="355" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Row 1: Input blocks -->
  <rect x="30"  y="68" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="83"  y="100" text-anchor="middle" font-size="10" fill="#94a3b8">INPUT A</text>
  <text x="83"  y="115" text-anchor="middle" font-size="8"  fill="#cbd5e1">(e.g. Sensor)</text>

  <rect x="160" y="68" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="213" y="100" text-anchor="middle" font-size="10" fill="#94a3b8">INPUT B</text>
  <text x="213" y="115" text-anchor="middle" font-size="8"  fill="#cbd5e1">(e.g. User cmd)</text>

  <!-- Arrow row 1 → row 2 -->
  <line x1="83"  y1="138" x2="83"  y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="213" y1="138" x2="213" y2="168" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Horizontal arrow input A → Processing -->
  <line x1="136" y1="103" x2="160" y2="103" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Row 2: Processing -->
  <rect x="30"  y="168" width="240" height="70" rx="6" fill="white" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#3b82f6">PROCESSING / CONTROLLER</text>
  <text x="150" y="215" text-anchor="middle" font-size="8"  fill="#93c5fd">(e.g. Raspberry Pi, microcontroller)</text>

  <!-- Arrow row 2 → row 3 left (output A) -->
  <line x1="83"  y1="238" x2="83"  y2="268" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <!-- Arrow row 2 → row 3 right (output B) -->
  <line x1="213" y1="238" x2="213" y2="268" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Row 3: Outputs -->
  <rect x="30"  y="268" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="83"  y="300" text-anchor="middle" font-size="10" fill="#94a3b8">OUTPUT A</text>
  <text x="83"  y="315" text-anchor="middle" font-size="8"  fill="#cbd5e1">(e.g. Motor)</text>

  <rect x="160" y="268" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="213" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">OUTPUT B</text>
  <text x="213" y="315" text-anchor="middle" font-size="8"  fill="#cbd5e1">(e.g. Display)</text>

  <!-- Feedback path (blue dashed) -->
  <path d="M 83,338 Q 83,360 150,360 Q 217,360 213,338" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <text x="150" y="373" text-anchor="middle" font-size="8" fill="#3b82f6">Feedback path (closed-loop only)</text>

  <!-- Right side: example filled-in version -->
  <rect x="300" y="58" width="240" height="300" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Example (filled in):</text>

  <rect x="316" y="84" width="90" height="36" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="361" y="98" text-anchor="middle" font-size="9" fill="#1e293b">Electron HMI</text>
  <text x="361" y="111" text-anchor="middle" font-size="8" fill="#64748b">(User command)</text>

  <line x1="361" y1="120" x2="361" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="374" y="130" font-size="7" fill="#64748b">WebSocket</text>

  <rect x="316" y="136" width="196" height="36" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="414" y="150" text-anchor="middle" font-size="9" fill="#1e293b">Raspberry Pi controller</text>
  <text x="414" y="163" text-anchor="middle" font-size="8" fill="#64748b">(arm_controller.py)</text>

  <line x1="361" y1="172" x2="361" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="374" y="182" font-size="7" fill="#64748b">UART 1Mbaud</text>

  <rect x="316" y="188" width="90" height="36" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="361" y="202" text-anchor="middle" font-size="9" fill="#1e293b">ST3215 Servo</text>
  <text x="361" y="215" text-anchor="middle" font-size="8" fill="#64748b">(motor output)</text>

  <rect x="416" y="188" width="90" height="36" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="461" y="202" text-anchor="middle" font-size="9" fill="#1e293b">AS5600 Encoder</text>
  <text x="461" y="215" text-anchor="middle" font-size="8" fill="#64748b">(position feedback)</text>

  <!-- Feedback arrow (example) -->
  <path d="M 461,224 Q 461,250 414,250 Q 367,250 361,224" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>
  <text x="414" y="265" text-anchor="middle" font-size="8" fill="#3b82f6">Encoder position → controller</text>

  <!-- Notes -->
  <text x="414" y="296" text-anchor="middle" font-size="9" fill="#64748b">Use this template to map out</text>
  <text x="414" y="308" text-anchor="middle" font-size="9" fill="#64748b">any system you design.</text>
  <text x="414" y="322" text-anchor="middle" font-size="9" fill="#64748b">Label each arrow with the</text>
  <text x="414" y="334" text-anchor="middle" font-size="9" fill="#64748b">signal name or protocol.</text>
  <text x="414" y="348" text-anchor="middle" font-size="9" fill="#3b82f6">Blue dashed = feedback</text>
</svg>
