<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#f8fafc" rx="8"/>

  <!-- Title / instruction area -->
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">System Block Diagram Template</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#64748b">Add your components in the boxes - draw arrows to show signal and data flow</text>

  <!-- Grid guide lines (light, behind the template only) -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="20" y1="55" x2="285" y2="55"/>
    <line x1="20" y1="155" x2="285" y2="155"/>
    <line x1="20" y1="255" x2="285" y2="255"/>
    <line x1="20" y1="345" x2="285" y2="345"/>
    <line x1="150" y1="55" x2="150" y2="345"/>
  </g>

  <!-- Row 1: Input blocks -->
  <rect x="30" y="68" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="83" y="100" text-anchor="middle" font-size="10" fill="#475569">INPUT A</text>
  <text x="83" y="115" text-anchor="middle" font-size="9" fill="#64748b">(e.g. Sensor)</text>

  <rect x="164" y="68" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="217" y="100" text-anchor="middle" font-size="10" fill="#475569">INPUT B</text>
  <text x="217" y="115" text-anchor="middle" font-size="9" fill="#64748b">(e.g. User cmd)</text>

  <!-- Inputs → processing -->
  <line x1="83" y1="138" x2="83" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="217" y1="138" x2="217" y2="164" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Row 2: Processing -->
  <rect x="30" y="168" width="240" height="70" rx="6" fill="white" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#1d4ed8">PROCESSING / CONTROLLER</text>
  <text x="150" y="215" text-anchor="middle" font-size="9" fill="#2563eb">(e.g. onboard computer, microcontroller)</text>

  <!-- Processing → outputs -->
  <line x1="83" y1="238" x2="83" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <line x1="217" y1="238" x2="217" y2="264" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="4,3"/>

  <!-- Row 3: Outputs -->
  <rect x="30" y="268" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="83" y="300" text-anchor="middle" font-size="10" fill="#475569">OUTPUT A</text>
  <text x="83" y="315" text-anchor="middle" font-size="9" fill="#64748b">(e.g. Motor)</text>

  <rect x="164" y="268" width="106" height="70" rx="6" fill="white" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="217" y="300" text-anchor="middle" font-size="10" fill="#475569">OUTPUT B</text>
  <text x="217" y="315" text-anchor="middle" font-size="9" fill="#64748b">(e.g. Display)</text>

  <!-- Feedback path: output A back to the controller -->
  <polyline points="30,320 18,320 18,203 26,203" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-b)"/>
  <line x1="40" y1="362" x2="58" y2="362" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="64" y="365" font-size="9" fill="#2563eb">Feedback path (closed-loop systems only)</text>

  <!-- Right side: example filled-in version -->
  <rect x="300" y="58" width="240" height="300" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="76" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Example (filled in):</text>

  <rect x="316" y="84" width="90" height="36" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="361" y="98" text-anchor="middle" font-size="9" fill="#1e293b">Electron HMI</text>
  <text x="361" y="111" text-anchor="middle" font-size="8.5" fill="#64748b">(User command)</text>

  <line x1="361" y1="120" x2="361" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-d)"/>
  <text x="370" y="131" font-size="8" fill="#475569">WebSocket</text>

  <rect x="316" y="136" width="196" height="36" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="414" y="150" text-anchor="middle" font-size="9" fill="#1e293b">Onboard computer</text>
  <text x="414" y="163" text-anchor="middle" font-size="8.5" fill="#64748b">(server.js)</text>

  <line x1="361" y1="172" x2="361" y2="184" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-d)"/>
  <text x="370" y="183" font-size="8" fill="#475569">UART 1 Mbaud</text>

  <rect x="316" y="188" width="90" height="36" rx="5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="361" y="202" text-anchor="middle" font-size="9" fill="#1e293b">ST3215 Servo</text>
  <text x="361" y="215" text-anchor="middle" font-size="8.5" fill="#64748b">(motor output)</text>

  <rect x="416" y="188" width="90" height="36" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="461" y="202" text-anchor="middle" font-size="9" fill="#1e293b">AS5600 Encoder</text>
  <text x="461" y="215" text-anchor="middle" font-size="8.5" fill="#64748b">(position feedback)</text>

  <!-- Feedback (example): encoder back up to the controller -->
  <polyline points="506,206 526,206 526,154 516,154" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>
  <text x="420" y="244" text-anchor="middle" font-size="8.5" fill="#2563eb">Encoder position → controller</text>

  <!-- Notes -->
  <text x="420" y="282" text-anchor="middle" font-size="9" fill="#64748b">Use this template to map out</text>
  <text x="420" y="295" text-anchor="middle" font-size="9" fill="#64748b">any system you design.</text>
  <text x="420" y="311" text-anchor="middle" font-size="9" fill="#64748b">Label each arrow with the</text>
  <text x="420" y="324" text-anchor="middle" font-size="9" fill="#64748b">signal name or protocol.</text>
  <text x="420" y="342" text-anchor="middle" font-size="9" fill="#2563eb">Blue dashed = feedback</text>
</svg>
