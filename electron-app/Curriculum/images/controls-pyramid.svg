<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#f8fafc" rx="8"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Hierarchy of Controls</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#64748b">Most effective (top) → Least effective (bottom)</text>

  <g transform="translate(60,0)">
    <!-- Level 1 - Eliminate (tip of pyramid) -->
    <polygon points="260,60 175,130 345,130" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="260" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="white">1. ELIMINATE</text>
    <text x="260" y="113" text-anchor="middle" font-size="10" fill="#fecaca">Remove the hazard</text>

    <!-- Level 2 - Substitute -->
    <polygon points="175,134 130,194 390,194 345,134" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
    <text x="260" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="white">2. SUBSTITUTE</text>
    <text x="260" y="177" text-anchor="middle" font-size="10" fill="#fff7ed">Replace with less dangerous option</text>

    <!-- Level 3 - Engineering controls -->
    <polygon points="130,198 82,258 438,258 390,198" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <text x="260" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1917">3. ENGINEERING CONTROLS</text>
    <text x="260" y="241" text-anchor="middle" font-size="10" fill="#451a03">Guards, interlocks, software limits</text>

    <!-- Level 4 - Administrative -->
    <polygon points="82,262 32,322 488,322 438,262" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
    <text x="260" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="white">4. ADMINISTRATIVE CONTROLS</text>
    <text x="260" y="305" text-anchor="middle" font-size="10" fill="#f0fdf4">Procedures, training, supervision</text>

    <!-- Level 5 - PPE (base) -->
    <polygon points="32,326 20,380 500,380 488,326" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="260" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="white">5. PPE</text>
    <text x="260" y="369" text-anchor="middle" font-size="10" fill="#eff6ff">Personal protective equipment (last resort)</text>
  </g>

  <!-- Effectiveness scale (right margin) -->
  <text x="600" y="72" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">Most</text>
  <text x="600" y="85" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">effective</text>
  <line x1="600" y1="94" x2="600" y2="346" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="366" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="700">Least</text>
  <text x="600" y="379" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="700">effective</text>

  <!-- This arm example annotations (left margin) -->
  <text x="14" y="214" font-size="9" fill="#64748b" font-style="italic">On this arm:</text>
  <text x="14" y="228" font-size="10" fill="#b45309">Dead zones,</text>
  <text x="14" y="241" font-size="10" fill="#b45309">current limits →</text>
  <text x="14" y="292" font-size="10" fill="#166534">Lab rules,</text>
  <text x="14" y="305" font-size="10" fill="#166534">SOPs →</text>

  <text x="320" y="405" text-anchor="middle" font-size="10" fill="#64748b">Always work down from the top - eliminate before substituting; engineer before warning</text>
</svg>
