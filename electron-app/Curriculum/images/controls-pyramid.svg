<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="520" height="420" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Hierarchy of Controls</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#64748b">Most effective (top) → Least effective (bottom)</text>

  <!-- Level 1 — Eliminate (tip of pyramid) -->
  <polygon points="260,60 175,130 345,130" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="260" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="white">1. ELIMINATE</text>
  <text x="260" y="113" text-anchor="middle" font-size="10" fill="#fecaca">Remove the hazard</text>

  <!-- Level 2 — Substitute -->
  <polygon points="175,134 130,194 390,194 345,134" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="white">2. SUBSTITUTE</text>
  <text x="260" y="177" text-anchor="middle" font-size="10" fill="#fed7aa">Replace with less dangerous option</text>

  <!-- Level 3 — Engineering controls -->
  <polygon points="130,198 82,258 438,258 390,198" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" font-weight="700" fill="#1c1917">3. ENGINEERING CONTROLS</text>
  <text x="260" y="241" text-anchor="middle" font-size="10" fill="#451a03">Guards, interlocks, software limits</text>

  <!-- Level 4 — Administrative -->
  <polygon points="82,262 32,322 488,322 438,262" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="260" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="white">4. ADMINISTRATIVE CONTROLS</text>
  <text x="260" y="305" text-anchor="middle" font-size="10" fill="#dcfce7">Procedures, training, supervision</text>

  <!-- Level 5 — PPE (base) -->
  <polygon points="32,326 20,380 500,380 488,326" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="260" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="white">5. PPE</text>
  <text x="260" y="369" text-anchor="middle" font-size="10" fill="#bfdbfe">Personal protective equipment (last resort)</text>

  <!-- Annotation arrows -->
  <text x="502" y="95" font-size="10" fill="#dc2626" font-weight="700">Most</text>
  <text x="502" y="108" font-size="10" fill="#dc2626" font-weight="700">effective</text>
  <line x1="498" y1="112" x2="498" y2="370" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="502" y="378" font-size="10" fill="#3b82f6" font-weight="700">Least</text>

  <!-- This arm example annotations -->
  <text x="18" y="232" text-anchor="end" font-size="10" fill="#d97706">← Dead zones,</text>
  <text x="18" y="244" text-anchor="end" font-size="10" fill="#d97706">  current limits</text>
  <text x="18" y="298" text-anchor="end" font-size="10" fill="#166534">← Lab rules,</text>
  <text x="18" y="310" text-anchor="end" font-size="10" fill="#166534">  SOPs</text>

  <text x="260" y="405" text-anchor="middle" font-size="10" fill="#64748b">Always work down from the top — eliminate before substituting; engineer before warning</text>
</svg>
