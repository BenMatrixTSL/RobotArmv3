<svg viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="540" height="400" fill="#f8fafc" rx="8"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Software Architecture - System Layers</text>

  <!-- Layer 1: HMI / Electron App -->
  <rect x="40" y="45" width="460" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="50" y="68" font-size="10" fill="#2563eb">JavaScript / HTML</text>
  <text x="270" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Layer 1 - HMI / Electron App</text>
  <text x="270" y="85" text-anchor="middle" font-size="10" fill="#2563eb">Tabs: Joint Control · Pendant · G-Code · Blockly · 3D View · Kinematics · Settings</text>

  <!-- Each link: solid arrow = commands down, dashed arrow = data back up -->
  <line x1="262" y1="102" x2="262" y2="114" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="278" y1="121" x2="278" y2="109" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-l)"/>
  <text x="292" y="115" font-size="10" fill="#475569">WebSocket · JSON · TCP port 8080</text>

  <!-- Layer 2: Network -->
  <rect x="40" y="122" width="460" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Layer 2 - Network Transport</text>
  <text x="270" y="157" text-anchor="middle" font-size="10" fill="#15803d">Wi-Fi / Ethernet · TCP/IP · Latency ~1–10 ms · JSON command packets</text>

  <line x1="262" y1="167" x2="262" y2="179" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="278" y1="186" x2="278" y2="174" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-l)"/>
  <text x="292" y="180" font-size="10" fill="#475569">Received by the Node.js WebSocket server</text>

  <!-- Layer 3: Server on the onboard computer -->
  <rect x="40" y="187" width="460" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="50" y="210" font-size="10" fill="#7c3aed">Node.js</text>
  <text x="270" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Layer 3 - Controller (onboard computer)</text>
  <text x="270" y="227" text-anchor="middle" font-size="10" fill="#7c3aed">Control session · Safety checks · Kinematics · Unit conversion (° → encoder counts)</text>

  <line x1="262" y1="244" x2="262" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="278" y1="263" x2="278" y2="251" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-l)"/>
  <text x="292" y="257" font-size="10" fill="#475569">UART serial · 1 Mbaud · Half-duplex</text>

  <!-- Layer 4: Serial Protocol -->
  <rect x="40" y="264" width="460" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="270" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Layer 4 - Serial Protocol</text>
  <text x="270" y="299" text-anchor="middle" font-size="10" fill="#c2410c">Feetech SCServo protocol · Addressed packets · ID 1–N · Checksum byte</text>

  <line x1="262" y1="309" x2="262" y2="321" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="278" y1="328" x2="278" y2="316" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-l)"/>
  <text x="292" y="322" font-size="10" fill="#475569">Position commands out · Telemetry data back</text>

  <!-- Layer 5: Hardware -->
  <rect x="40" y="329" width="460" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="270" y="349" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Layer 5 - Actuators &amp; Sensors</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#dc2626">ST3215 servo motors · AS5600 magnetic encoders · PID control runs here</text>

  <!-- Side label -->
  <text x="18" y="210" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="600" transform="rotate(-90,18,210)">USER → HARDWARE</text>

  <text x="270" y="390" text-anchor="middle" font-size="9" fill="#64748b">Solid arrows = commands down · dashed arrows = status / telemetry back up</text>
</svg>
