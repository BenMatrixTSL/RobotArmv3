     y="214"
     text-anchor="middle"
     font-size="11"
     font-weight="700"
     fill="white"
     id="text6">2. Partial Automation</text>
  <text
     x="250"
     y="229"
     text-anchor="middle"
     font-size="9"
     fill="#bbf7d0"
     id="text7">Robot does tasks; human supervises and loads parts</text>
  <!-- Level 1 — Assisted manual -->
  <polygon
     points="88,250 40,310 460,310 412,250"
     fill="#ea580c"
     stroke="#c2410c"
     stroke-width="1.5"
     id="polygon7" />
  <text
     x="250"
     y="278"
     text-anchor="middle"
     font-size="11"
     font-weight="700"
     fill="white"
     id="text8">1. Assisted Manual</text>
  <text
     x="250"
     y="293"
     text-anchor="middle"
     font-size="9"
     fill="#fed7aa"
     id="text9">Human works with tools/jigs; no autonomous robot motion</text>
  <!-- Level 0 — Manual (base) -->
  <polygon
     points="40,314 20,362 480,362 460,314"
     fill="#94a3b8"
     stroke="#64748b"
     stroke-width="1.5"
     id="polygon9" />
