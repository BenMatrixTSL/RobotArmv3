     y="336"
     text-anchor="middle"
     font-size="11px"
     font-weight="700"
     fill="#ffffff"
     id="text10">0. Fully Manual</text>
  <text
     x="250"
     y="351"
     text-anchor="middle"
     font-size="9px"
     fill="#f1f5f9"
     id="text11">All tasks done by hand — no automation</text>
  <!-- Right side annotation -->
  <text
     x="490"
     y="90"
     text-anchor="end"
     font-size="9"
     fill="#7c3aed"
     id="text12">Self-learning,</text>
  <text
     x="490"
     y="102"
     text-anchor="end"
     font-size="9"
     fill="#7c3aed"
     id="text13">adaptive control</text>
  <text
     x="490"
     y="150"
     text-anchor="end"
     font-size="9"
     fill="#3b82f6"
     id="text14">24/7, no operator</text>
  <text
     x="490"
     y="215"
     text-anchor="end"
     font-size="9"
     fill="#16a34a"
     id="text15">Operator loads parts</text>
  <text
     x="490"
     y="266"
     text-anchor="end"
     font-size="9px"
     fill="#ea580c"
     id="text16">Power tools,</text>
  <text
     x="490"
     y="278"
     text-anchor="end"
     font-size="9px"
     fill="#ea580c"
     id="text17">jigs, fixtures</text>
  <!-- Left side: "This arm" marker -->
  <text
     x="10"
     y="147"
     font-size="9px"
     fill="#3b82f6"
     id="text18">← This arm</text>
  <text
     x="10"
     y="159"
