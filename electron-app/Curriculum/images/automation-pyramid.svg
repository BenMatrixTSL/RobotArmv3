     y="40"
     text-anchor="middle"
     font-size="11"
     fill="#64748b"
     id="text2">From fully manual to fully adaptive — each level increases productivity and reduces human error</text>
  <!-- Level 4 — Adaptive / AI (tip) -->
  <polygon
     points="250,58 178,118 322,118"
     fill="#7c3aed"
     stroke="#6d28d9"
     stroke-width="1.5"
     id="polygon2" />
  <text
     x="250"
     y="102"
     text-anchor="middle"
     font-size="11px"
     font-weight="700"
     fill="#ffffff"
     id="text3">4. Adaptive / AI</text>
  <!-- Level 3 — Full automation -->
  <polygon
     points="178,122 134,182 366,182 322,122"
     fill="#3b82f6"
     stroke="#1d4ed8"
     stroke-width="1.5"
     id="polygon3" />
  <text
     x="250"
     y="150"
     text-anchor="middle"
     font-size="11"
     font-weight="700"
     fill="white"
     id="text4">3. Full Automation</text>
  <text
     x="250"
     y="165"
     text-anchor="middle"
     font-size="9"
     fill="#bfdbfe"
     id="text5">Robot operates independently, monitors itself</text>
  <!-- Level 2 — Partial automation -->
  <polygon
     points="134,186 88,246 412,246 366,186"
     fill="#16a34a"
     stroke="#15803d"
     stroke-width="1.5"
