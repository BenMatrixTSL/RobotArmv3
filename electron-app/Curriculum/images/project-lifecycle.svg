<svg viewBox="0 0 580 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="580" height="200" fill="#f8fafc" rx="8"/>
  <text x="290" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Engineering Project Lifecycle</text>

  <!-- Phase blocks -->
  <!-- Brief -->
  <rect x="12" y="50" width="76" height="80" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="50" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">1. Brief</text>
  <text x="50" y="95" text-anchor="middle" font-size="9" fill="#bfdbfe">&amp;</text>
  <text x="50" y="107" text-anchor="middle" font-size="9" fill="#bfdbfe">Scope</text>

  <line x1="88" y1="90" x2="104" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Research -->
  <rect x="104" y="50" width="76" height="80" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="142" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">2. Research</text>
  <text x="142" y="95" text-anchor="middle" font-size="9" fill="#ddd6fe">&amp;</text>
  <text x="142" y="107" text-anchor="middle" font-size="9" fill="#ddd6fe">Specify</text>

  <line x1="180" y1="90" x2="196" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Design -->
  <rect x="196" y="50" width="76" height="80" rx="8" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="234" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">3. Design</text>
  <text x="234" y="95" text-anchor="middle" font-size="9" fill="#fed7aa">&amp;</text>
  <text x="234" y="107" text-anchor="middle" font-size="9" fill="#fed7aa">Model</text>

  <line x1="272" y1="90" x2="288" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Build -->
  <rect x="288" y="50" width="76" height="80" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  <text x="326" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">4. Build</text>
  <text x="326" y="95" text-anchor="middle" font-size="9" fill="#bbf7d0">&amp;</text>
  <text x="326" y="107" text-anchor="middle" font-size="9" fill="#bbf7d0">Program</text>

  <line x1="364" y1="90" x2="380" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Test -->
  <rect x="380" y="50" width="76" height="80" rx="8" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
  <text x="418" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">5. Test</text>
  <text x="418" y="95" text-anchor="middle" font-size="9" fill="#bae6fd">&amp;</text>
  <text x="418" y="107" text-anchor="middle" font-size="9" fill="#bae6fd">Evaluate</text>

  <line x1="456" y1="90" x2="472" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Document & Present -->
  <rect x="472" y="50" width="96" height="80" rx="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="520" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="white">6. Document</text>
  <text x="520" y="95" text-anchor="middle" font-size="9" fill="#cbd5e1">&amp;</text>
  <text x="520" y="107" text-anchor="middle" font-size="9" fill="#cbd5e1">Present</text>

  <!-- Iteration arrow (below) -->
  <path d="M 520,130 Q 520,160 290,160 Q 60,160 50,130" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5,3"/>
  <text x="290" y="178" text-anchor="middle" font-size="10" fill="#3b82f6">Iteration — findings from Test &amp; Evaluate may send you back to Design or Build</text>

  <!-- Key deliverables below each phase -->
  <text x="50"  y="148" text-anchor="middle" font-size="8" fill="#64748b">Client brief</text>
  <text x="50"  y="158" text-anchor="middle" font-size="8" fill="#64748b">constraints</text>
  <text x="142" y="148" text-anchor="middle" font-size="8" fill="#64748b">Specification</text>
  <text x="142" y="158" text-anchor="middle" font-size="8" fill="#64748b">risk register</text>
  <text x="234" y="148" text-anchor="middle" font-size="8" fill="#64748b">Drawings</text>
  <text x="234" y="158" text-anchor="middle" font-size="8" fill="#64748b">models</text>
  <text x="326" y="148" text-anchor="middle" font-size="8" fill="#64748b">Working</text>
  <text x="326" y="158" text-anchor="middle" font-size="8" fill="#64748b">prototype</text>
  <text x="418" y="148" text-anchor="middle" font-size="8" fill="#64748b">Test records</text>
  <text x="418" y="158" text-anchor="middle" font-size="8" fill="#64748b">evaluation</text>
  <text x="520" y="148" text-anchor="middle" font-size="8" fill="#64748b">Report</text>
  <text x="520" y="158" text-anchor="middle" font-size="8" fill="#64748b">presentation</text>
</svg>
