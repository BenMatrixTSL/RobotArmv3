<svg viewBox="0 0 580 208" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="580" height="208" fill="#f8fafc" rx="8"/>
  <text x="290" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Engineering Project Lifecycle</text>

  <!-- Phase blocks -->
  <g font-size="9" fill="#f1f5f9" text-anchor="middle">
    <rect x="12" y="50" width="76" height="80" rx="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="50" y="82" font-size="10" font-weight="700" fill="white">1. Brief</text>
    <text x="50" y="95">&amp;</text>
    <text x="50" y="107">Scope</text>

    <rect x="104" y="50" width="76" height="80" rx="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="142" y="82" font-size="10" font-weight="700" fill="white">2. Research</text>
    <text x="142" y="95">&amp;</text>
    <text x="142" y="107">Specify</text>

    <rect x="196" y="50" width="76" height="80" rx="8" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
    <text x="234" y="82" font-size="10" font-weight="700" fill="white">3. Design</text>
    <text x="234" y="95">&amp;</text>
    <text x="234" y="107">Model</text>

    <rect x="288" y="50" width="76" height="80" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
    <text x="326" y="82" font-size="10" font-weight="700" fill="white">4. Build</text>
    <text x="326" y="95">&amp;</text>
    <text x="326" y="107">Program</text>

    <rect x="380" y="50" width="76" height="80" rx="8" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <text x="418" y="82" font-size="10" font-weight="700" fill="white">5. Test</text>
    <text x="418" y="95">&amp;</text>
    <text x="418" y="107">Evaluate</text>

    <rect x="472" y="50" width="96" height="80" rx="8" fill="#475569" stroke="#334155" stroke-width="1.5"/>
    <text x="520" y="82" font-size="10" font-weight="700" fill="white">6. Document</text>
    <text x="520" y="95">&amp;</text>
    <text x="520" y="107">Present</text>
  </g>

  <!-- Forward arrows (tips stop at the next box edge) -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr)">
    <line x1="88"  y1="90" x2="100" y2="90"/>
    <line x1="180" y1="90" x2="192" y2="90"/>
    <line x1="272" y1="90" x2="284" y2="90"/>
    <line x1="364" y1="90" x2="376" y2="90"/>
    <line x1="456" y1="90" x2="468" y2="90"/>
  </g>

  <!-- Key deliverables below each phase -->
  <g font-size="8.5" fill="#475569" text-anchor="middle">
    <text x="50"  y="146">Client brief</text>
    <text x="50"  y="157">constraints</text>
    <text x="142" y="146">Specification</text>
    <text x="142" y="157">risk register</text>
    <text x="234" y="146">Drawings</text>
    <text x="234" y="157">models</text>
    <text x="326" y="146">Working</text>
    <text x="326" y="157">prototype</text>
    <text x="418" y="146">Test records</text>
    <text x="418" y="157">evaluation</text>
    <text x="520" y="146">Report</text>
    <text x="520" y="157">presentation</text>
  </g>

  <!-- Iteration: Test & Evaluate back to Design or Build (routed beside the deliverable text, below it) -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="5,3">
    <polyline points="450,130 450,170 264,170 264,135" marker-end="url(#arr-b)"/>
    <line x1="356" y1="170" x2="356" y2="135" marker-end="url(#arr-b)"/>
  </g>
  <text x="290" y="190" text-anchor="middle" font-size="10" fill="#2563eb">Iteration - findings from Test &amp; Evaluate may send you back to Design or Build</text>
</svg>
