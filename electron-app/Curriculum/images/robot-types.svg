<svg viewBox="0 0 560 392" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="560" height="392" fill="#f8fafc" rx="8"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Industrial Robot Types</text>

  <!-- Quadrant dividers -->
  <line x1="280" y1="38" x2="280" y2="384" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="20" y1="224" x2="540" y2="224" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== ARTICULATED (top-left) ===== -->
  <text x="140" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">Articulated</text>
  <rect x="105" y="150" width="70" height="14" rx="3" fill="#475569"/>
  <!-- Base (140,150) → shoulder (140,118) → elbow (119.4,88.5) → wrist (129,62.2) -->
  <g stroke-linecap="round">
    <line x1="140" y1="150" x2="140" y2="118" stroke="#93c5fd" stroke-width="12"/>
    <line x1="140" y1="118" x2="119.4" y2="88.5" stroke="#bfdbfe" stroke-width="11"/>
    <line x1="119.4" y1="88.5" x2="129" y2="62.2" stroke="#dbeafe" stroke-width="10"/>
  </g>
  <circle cx="140" cy="150" r="8" fill="#3b82f6"/>
  <circle cx="140" cy="118" r="6" fill="#3b82f6"/>
  <circle cx="119.4" cy="88.5" r="6" fill="#3b82f6"/>
  <circle cx="129" cy="62.2" r="5" fill="#1d4ed8"/>
  <text x="140" y="181" text-anchor="middle" font-size="10" fill="#64748b">6 DOF · most flexible</text>
  <text x="140" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">This arm's type</text>
  <rect x="70" y="200" width="140" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="140" y="212.5" text-anchor="middle" font-size="9" fill="#1d4ed8">Car assembly, welding</text>

  <!-- ===== SCARA (top-right) ===== -->
  <text x="420" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">SCARA</text>
  <rect x="388" y="98" width="18" height="54" rx="4" fill="#475569"/>
  <rect x="370" y="150" width="54" height="14" rx="3" fill="#475569"/>
  <g stroke-linecap="round">
    <line x1="397" y1="98" x2="466" y2="98" stroke="#c4b5fd" stroke-width="14"/>
    <line x1="466" y1="98" x2="510" y2="98" stroke="#ddd6fe" stroke-width="12"/>
    <line x1="510" y1="98" x2="510" y2="138" stroke="#6d28d9" stroke-width="4"/>
  </g>
  <circle cx="397" cy="98" r="7" fill="#7c3aed"/>
  <circle cx="466" cy="98" r="7" fill="#7c3aed"/>
  <circle cx="510" cy="141" r="5" fill="#7c3aed"/>
  <text x="397" y="82" text-anchor="middle" font-size="11" fill="#7c3aed">↺</text>
  <text x="466" y="82" text-anchor="middle" font-size="11" fill="#7c3aed">↺</text>
  <text x="522" y="124" font-size="9" fill="#6d28d9">Z</text>
  <text x="420" y="181" text-anchor="middle" font-size="10" fill="#64748b">Horizontal reach + Z axis</text>
  <text x="420" y="194" text-anchor="middle" font-size="10" fill="#64748b">Fast, rigid in Z</text>
  <rect x="350" y="200" width="140" height="18" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="420" y="212.5" text-anchor="middle" font-size="9" fill="#6d28d9">PCB assembly, pick &amp; place</text>

  <!-- ===== DELTA (bottom-left) ===== -->
  <text x="140" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Delta / Parallel</text>
  <line x1="90" y1="260" x2="190" y2="260" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#86efac" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="260" x2="128" y2="325"/>
    <line x1="140" y1="260" x2="140" y2="325"/>
    <line x1="180" y1="260" x2="152" y2="325"/>
  </g>
  <ellipse cx="140" cy="325" rx="22" ry="8" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <text x="140" y="354" text-anchor="middle" font-size="10" fill="#64748b">Very fast, lightweight</text>
  <rect x="70" y="361" width="140" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="140" y="373.5" text-anchor="middle" font-size="9" fill="#166534">Food sorting, packaging</text>

  <!-- ===== COBOT (bottom-right) ===== -->
  <text x="420" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">Collaborative (Cobot)</text>
  <!-- Safety halo -->
  <circle cx="420" cy="292" r="36" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="388" y="328" width="64" height="14" rx="3" fill="#475569"/>
  <g stroke-linecap="round">
    <line x1="420" y1="328" x2="420" y2="292" stroke="#fdba74" stroke-width="12"/>
    <line x1="420" y1="292" x2="405" y2="260" stroke="#fed7aa" stroke-width="11"/>
  </g>
  <circle cx="420" cy="328" r="8" fill="#ea580c"/>
  <circle cx="420" cy="292" r="6" fill="#ea580c"/>
  <circle cx="405" cy="260" r="6" fill="#ea580c"/>
  <!-- Person working alongside -->
  <g stroke="#94a3b8" stroke-linecap="round">
    <line x1="478" y1="282" x2="478" y2="312" stroke-width="5"/>
    <line x1="478" y1="292" x2="462" y2="304" stroke-width="4"/>
    <line x1="478" y1="312" x2="470" y2="332" stroke-width="4"/>
    <line x1="478" y1="312" x2="486" y2="332" stroke-width="4"/>
  </g>
  <circle cx="478" cy="272" r="10" fill="#94a3b8"/>
  <text x="420" y="354" text-anchor="middle" font-size="10" fill="#64748b">Force-limited, human-safe</text>
  <rect x="350" y="361" width="140" height="18" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="420" y="373.5" text-anchor="middle" font-size="9" fill="#c2410c">Assembly assist, logistics</text>
</svg>
