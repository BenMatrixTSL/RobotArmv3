<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="560" height="300" fill="#f8fafc" rx="8"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Common Failure Modes in Mechanical Structures</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#64748b">Understanding how components fail helps engineers design safer systems</text>

  <!-- Panel 1: Fatigue Crack -->
  <rect x="12" y="50" width="162" height="230" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="93" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">1. Fatigue Crack</text>
  <!-- Bar with crack -->
  <rect x="40" y="88" width="106" height="28" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <!-- Crack -->
  <path d="M 93,88 L 80,102 L 95,116 L 85,130" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 93,88 L 80,102 L 95,116 L 85,130" stroke="#fca5a5" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Force arrows (cyclic) -->
  <line x1="93" y1="68" x2="93" y2="84" stroke="#475569" stroke-width="2"/>
  <polygon points="93,84 89,76 97,76" fill="#475569"/>
  <line x1="93" y1="148" x2="93" y2="132" stroke="#475569" stroke-width="2"/>
  <polygon points="93,132 89,140 97,140" fill="#475569"/>
  <text x="93" y="162" text-anchor="middle" font-size="9" fill="#475569">↕ Repeated load</text>

  <text x="93" y="185" text-anchor="middle" font-size="9" fill="#64748b">Repeated stress cycles</text>
  <text x="93" y="198" text-anchor="middle" font-size="9" fill="#64748b">weaken the material</text>
  <text x="93" y="212" text-anchor="middle" font-size="9" fill="#64748b">even below the yield</text>
  <text x="93" y="226" text-anchor="middle" font-size="9" fill="#64748b">strength. Cracks grow</text>
  <text x="93" y="240" text-anchor="middle" font-size="9" fill="#64748b">until sudden fracture.</text>
  <rect x="28" y="252" width="130" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="93" y="265" text-anchor="middle" font-size="9" fill="#dc2626">Robot arm: joint cyclic load</text>

  <!-- Panel 2: Buckling -->
  <rect x="198" y="50" width="162" height="230" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="279" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">2. Buckling</text>
  <!-- Column with bowing -->
  <path d="M 279,88 Q 254,148 279,200" stroke="#94a3b8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 279,88 Q 254,148 279,200" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,2"/>
  <!-- Vertical dashed (original) -->
  <line x1="279" y1="88" x2="279" y2="200" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <!-- Force arrows (compressive) -->
  <line x1="279" y1="68" x2="279" y2="84" stroke="#475569" stroke-width="2"/>
  <polygon points="279,84 275,76 283,76" fill="#475569"/>
  <line x1="279" y1="220" x2="279" y2="204" stroke="#475569" stroke-width="2"/>
  <polygon points="279,204 275,212 283,212" fill="#475569"/>
  <text x="279" y="234" text-anchor="middle" font-size="9" fill="#475569">↕ Compressive load</text>

  <text x="279" y="250" text-anchor="middle" font-size="9" fill="#64748b">Slender column collapses</text>
  <text x="279" y="264" text-anchor="middle" font-size="9" fill="#64748b">sideways under compression.</text>
  <rect x="208" y="274" width="142" height="20" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="279" y="287" text-anchor="middle" font-size="9" fill="#ea580c">Robot arm: thin links, overload</text>

  <!-- Panel 3: Overloaded Joint -->
  <rect x="384" y="50" width="162" height="230" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="465" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">3. Overload / Shear</text>
  <!-- Two blocks with shear plane -->
  <rect x="415" y="100" width="100" height="36" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="415" y="136" width="100" height="36" rx="4" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <!-- Shear plane -->
  <line x1="415" y1="136" x2="515" y2="136" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Offset showing shear -->
  <path d="M 465,100 L 465,90 L 495,90 L 495,100" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <!-- Force arrows (shear) -->
  <line x1="415" y1="118" x2="388" y2="118" stroke="#dc2626" stroke-width="2"/>
  <polygon points="388,118 396,114 396,122" fill="#dc2626"/>
  <line x1="515" y1="154" x2="542" y2="154" stroke="#dc2626" stroke-width="2"/>
  <polygon points="542,154 534,150 534,158" fill="#dc2626"/>
  <text x="465" y="96" text-anchor="middle" font-size="9" fill="#7c3aed">Shear plane</text>
  <text x="465" y="200" text-anchor="middle" font-size="9" fill="#64748b">Force exceeds material</text>
  <text x="465" y="213" text-anchor="middle" font-size="9" fill="#64748b">shear strength — joint</text>
  <text x="465" y="226" text-anchor="middle" font-size="9" fill="#64748b">slides and fails rapidly.</text>
  <rect x="394" y="252" width="142" height="20" rx="4" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="465" y="265" text-anchor="middle" font-size="9" fill="#7c3aed">Robot arm: seized servo bolt</text>

  <!-- Prevention footer -->
  <rect x="12" y="284" width="536" height="14" rx="4" fill="#f1f5f9"/>
  <text x="280" y="294" text-anchor="middle" font-size="9" fill="#475569">Prevention: correct material selection, safety factors ≥ 2, regular inspection, torque limits in firmware</text>
</svg>
