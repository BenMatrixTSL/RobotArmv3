<svg viewBox="0 0 560 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="560" height="318" fill="#f8fafc" rx="8"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Common Failure Modes in Mechanical Structures</text>
  <text x="280" y="38" text-anchor="middle" font-size="10" fill="#64748b">Understanding how components fail helps engineers design safer systems</text>

  <!-- Panel 1: Fatigue Crack -->
  <rect x="12" y="50" width="162" height="234" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="93" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">1. Fatigue Crack</text>
  <!-- Bar with crack -->
  <rect x="40" y="94" width="106" height="28" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 93,94 L 82,103 L 96,112 L 87,122" stroke="#fca5a5" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M 93,94 L 82,103 L 96,112 L 87,122" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Force arrows (cyclic) -->
  <line x1="93" y1="78" x2="93" y2="88" stroke="#475569" stroke-width="2"/>
  <polygon points="93,92 89,84 97,84" fill="#475569"/>
  <line x1="93" y1="138" x2="93" y2="128" stroke="#475569" stroke-width="2"/>
  <polygon points="93,124 89,132 97,132" fill="#475569"/>
  <text x="93" y="153" text-anchor="middle" font-size="9" fill="#475569">↕ Repeated load</text>

  <text x="93" y="176" text-anchor="middle" font-size="9" fill="#64748b">Repeated stress cycles</text>
  <text x="93" y="189" text-anchor="middle" font-size="9" fill="#64748b">weaken the material</text>
  <text x="93" y="202" text-anchor="middle" font-size="9" fill="#64748b">even below the yield</text>
  <text x="93" y="215" text-anchor="middle" font-size="9" fill="#64748b">strength. Cracks grow</text>
  <text x="93" y="228" text-anchor="middle" font-size="9" fill="#64748b">until sudden fracture.</text>
  <rect x="22" y="254" width="142" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="93" y="267" text-anchor="middle" font-size="9" fill="#dc2626">Robot arm: joint cyclic load</text>

  <!-- Panel 2: Buckling -->
  <rect x="198" y="50" width="162" height="234" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="279" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">2. Buckling</text>
  <!-- Column with bowing -->
  <path d="M 279,94 Q 254,139 279,184" stroke="#94a3b8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 279,94 Q 254,139 279,184" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="4,2"/>
  <!-- Vertical dashed (original shape) -->
  <line x1="279" y1="94" x2="279" y2="184" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <!-- Force arrows (compressive) -->
  <line x1="279" y1="76" x2="279" y2="80" stroke="#475569" stroke-width="2"/>
  <polygon points="279,84 275,76 283,76" fill="#475569"/>
  <line x1="279" y1="202" x2="279" y2="198" stroke="#475569" stroke-width="2"/>
  <polygon points="279,194 275,202 283,202" fill="#475569"/>
  <text x="279" y="216" text-anchor="middle" font-size="9" fill="#475569">↕ Compressive load</text>

  <text x="279" y="232" text-anchor="middle" font-size="9" fill="#64748b">Slender column collapses</text>
  <text x="279" y="245" text-anchor="middle" font-size="9" fill="#64748b">sideways under compression.</text>
  <rect x="208" y="254" width="142" height="20" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="279" y="267" text-anchor="middle" font-size="9" fill="#c2410c">Robot arm: thin links, overload</text>

  <!-- Panel 3: Overload / Shear -->
  <rect x="384" y="50" width="162" height="234" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="465" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">3. Overload / Shear</text>
  <!-- Two blocks sliding along the shear plane -->
  <rect x="420" y="100" width="90" height="36" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="420" y="136" width="90" height="36" rx="4" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <line x1="420" y1="136" x2="510" y2="136" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Offset showing slip -->
  <path d="M 465,100 L 465,88 L 492,88 L 492,100" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <!-- Force arrows (shear) -->
  <line x1="420" y1="118" x2="404" y2="118" stroke="#dc2626" stroke-width="2"/>
  <polygon points="398,118 406,114 406,122" fill="#dc2626"/>
  <line x1="510" y1="154" x2="526" y2="154" stroke="#dc2626" stroke-width="2"/>
  <polygon points="532,154 524,150 524,158" fill="#dc2626"/>
  <line x1="420" y1="186" x2="436" y2="186" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="442" y="189.5" font-size="9" fill="#7c3aed">= shear plane</text>
  <text x="465" y="208" text-anchor="middle" font-size="9" fill="#64748b">Force exceeds material</text>
  <text x="465" y="221" text-anchor="middle" font-size="9" fill="#64748b">shear strength - joint</text>
  <text x="465" y="234" text-anchor="middle" font-size="9" fill="#64748b">slides and fails rapidly.</text>
  <rect x="394" y="254" width="142" height="20" rx="4" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="465" y="267" text-anchor="middle" font-size="9" fill="#7c3aed">Robot arm: seized servo bolt</text>

  <!-- Prevention footer -->
  <rect x="12" y="292" width="536" height="18" rx="4" fill="#f1f5f9"/>
  <text x="280" y="304.5" text-anchor="middle" font-size="9" fill="#475569">Prevention: correct material selection, safety factors ≥ 2, regular inspection, torque limits in firmware</text>
</svg>
