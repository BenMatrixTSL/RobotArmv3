  <rect x="110" y="328" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="144" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">1</text>
  <rect x="178" y="328" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="212" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2</text>
  <rect x="246" y="328" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="280" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3</text>
  <rect x="314" y="328" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4</text>
  <rect x="382" y="328" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="416" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">5</text>
  <rect x="110" y="96" width="340" height="290" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Axis titles -->
  <text x="24" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b" transform="rotate(-90,24,241)">LIKELIHOOD →</text>
  <text x="280" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">SEVERITY →</text>

  <!-- Key -->
  <text x="40" y="440" font-size="10" font-weight="700" fill="#1e293b">Risk level:</text>
  <rect x="110" y="429" width="14" height="14" rx="3" fill="#dcfce7" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="129" y="440" font-size="10" fill="#334155">1–4 Low</text>
  <rect x="192" y="429" width="14" height="14" rx="3" fill="#fef08a" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="211" y="440" font-size="10" fill="#334155">5–9 Medium</text>
  <rect x="290" y="429" width="14" height="14" rx="3" fill="#ea580c" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="309" y="440" font-size="10" fill="#334155">10–16 High</text>
  <rect x="384" y="429" width="14" height="14" rx="3" fill="#dc2626" stroke="#94a3b8" stroke-width="0.75"/>
  <text x="403" y="440" font-size="10" fill="#334155">20–25 Extreme</text>
