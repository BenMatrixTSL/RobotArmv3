  <rect x="246" y="154" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="280" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">12</text>
  <rect x="314" y="154" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">16</text>
  <rect x="382" y="154" width="68" height="58" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="416" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">20</text>
  <rect x="110" y="212" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="144" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">3</text>
  <rect x="178" y="212" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="212" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">6</text>
  <rect x="246" y="212" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="280" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">9</text>
  <rect x="314" y="212" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">12</text>
  <rect x="382" y="212" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="416" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">15</text>
  <rect x="110" y="270" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="144" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">2</text>
  <rect x="178" y="270" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="212" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4</text>
  <rect x="246" y="270" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="280" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">6</text>
  <rect x="314" y="270" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">8</text>
  <rect x="382" y="270" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
