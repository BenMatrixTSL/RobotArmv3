<svg viewBox="0 0 520 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="520" height="460" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Risk Assessment Matrix</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#64748b">Likelihood × Severity = Risk score</text>

  <!-- Grid: columns x 110..450 (68 wide), rows y 96..386 (58 high) -->
  <!-- Column headers (severity) -->
  <text x="144" y="72" text-anchor="middle" font-size="10" fill="#475569">Negligible</text>
  <text x="144" y="84" text-anchor="middle" font-size="9" fill="#64748b">(1)</text>
  <text x="212" y="72" text-anchor="middle" font-size="10" fill="#475569">Minor</text>
  <text x="212" y="84" text-anchor="middle" font-size="9" fill="#64748b">(2)</text>
  <text x="280" y="72" text-anchor="middle" font-size="10" fill="#475569">Moderate</text>
  <text x="280" y="84" text-anchor="middle" font-size="9" fill="#64748b">(3)</text>
  <text x="348" y="72" text-anchor="middle" font-size="10" fill="#475569">Major</text>
  <text x="348" y="84" text-anchor="middle" font-size="9" fill="#64748b">(4)</text>
  <text x="416" y="72" text-anchor="middle" font-size="10" fill="#475569">Catastrophic</text>
  <text x="416" y="84" text-anchor="middle" font-size="9" fill="#64748b">(5)</text>
  <!-- Row headers (likelihood), centred on each row -->
  <text x="102" y="122.5" text-anchor="end" font-size="10" fill="#475569">Almost</text>
  <text x="102" y="134.5" text-anchor="end" font-size="10" fill="#475569">Certain (5)</text>
  <text x="102" y="186.5" text-anchor="end" font-size="10" fill="#475569">Likely (4)</text>
  <text x="102" y="244.5" text-anchor="end" font-size="10" fill="#475569">Possible (3)</text>
  <text x="102" y="302.5" text-anchor="end" font-size="10" fill="#475569">Unlikely (2)</text>
  <text x="102" y="360.5" text-anchor="end" font-size="10" fill="#475569">Rare (1)</text>
  <!-- Cells: score = likelihood × severity, coloured by band -->
  <rect x="110" y="96" width="68" height="58" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="144" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">5</text>
  <rect x="178" y="96" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="212" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">10</text>
  <rect x="246" y="96" width="68" height="58" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="280" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">15</text>
  <rect x="314" y="96" width="68" height="58" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">20</text>
  <rect x="382" y="96" width="68" height="58" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="416" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">25</text>
  <rect x="110" y="154" width="68" height="58" fill="#dcfce7" stroke="#ffffff" stroke-width="1.5"/>
  <text x="144" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">4</text>
