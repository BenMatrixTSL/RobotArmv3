<svg viewBox="0 0 520 456" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="520" height="456" fill="#f8fafc" rx="8"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Robot Work Cell - Floor Plan (Top View)</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#64748b">Showing operating envelope, dead zones, pick/place stations, and safety boundary</text>
  <text x="260" y="59" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">SAFETY BOUNDARY - Do not enter when arm is powered</text>

  <!-- Safety fence / cell boundary -->
  <rect x="40" y="66" width="440" height="360" rx="6" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10,5"/>

  <!-- Bench / workbench edge (back of the cell) -->
  <rect x="44" y="70" width="432" height="13" rx="3" fill="#cbd5e1"/>
  <text x="260" y="79.5" text-anchor="middle" font-size="9" fill="#334155">Bench edge / wall</text>

  <!-- Entry gate (gap in the fence) -->
  <rect x="220" y="420" width="80" height="12" fill="#f8fafc"/>
  <text x="260" y="440" text-anchor="middle" font-size="10" fill="#dc2626">Entry / E-Stop</text>

  <!-- Cell contents, arm centred at (240,241) -->
  <g transform="translate(0,11)">
    <!-- Full reachable workspace (max reach circle) -->
    <circle cx="240" cy="230" r="155" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="346" y="362" font-size="9" fill="#dc2626">Max reach</text>
    <text x="346" y="373" font-size="9" fill="#dc2626">(unrestricted)</text>

    <!-- Allowed operating envelope (software limits) -->
    <path d="M 240,230 L 240,80 A 150,150 0 0,1 390,230 Z" fill="#fef9c3" fill-opacity="0.7" stroke="#f59e0b" stroke-width="2"/>
    <text x="340" y="185" font-size="9" fill="#92400e" font-weight="600">Operating</text>
    <text x="340" y="197" font-size="9" fill="#92400e" font-weight="600">Envelope</text>
    <text x="340" y="209" font-size="9" fill="#92400e">(software</text>
    <text x="340" y="221" font-size="9" fill="#92400e">limits)</text>

    <!-- Dead zone (behind robot) -->
    <path d="M 240,230 L 240,80 A 150,150 0 0,0 90,230 Z" fill="#fee2e2" fill-opacity="0.7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="120" y="185" font-size="9" fill="#dc2626" font-weight="600">DEAD</text>
    <text x="120" y="197" font-size="9" fill="#dc2626" font-weight="600">ZONE</text>
    <text x="120" y="209" font-size="9" fill="#dc2626">(cables /</text>
    <text x="120" y="221" font-size="9" fill="#dc2626">electronics)</text>

    <!-- Robot base (top view - circle) -->
    <circle cx="240" cy="230" r="22" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <circle cx="240" cy="230" r="15" fill="#64748b"/>
    <text x="240" y="233.5" text-anchor="middle" font-size="9" fill="white" font-weight="700">ARM</text>

    <!-- Pick station -->
    <rect x="320" y="105" width="70" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="355" y="127" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">PICK</text>
    <text x="355" y="141" text-anchor="middle" font-size="9" fill="#2563eb">Station A</text>
    <circle cx="325" cy="155" r="6" fill="#3b82f6"/>
    <text x="326" y="171" text-anchor="middle" font-size="9" fill="#2563eb">P1</text>

    <!-- Place station -->
    <rect x="330" y="270" width="70" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="365" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">PLACE</text>
    <text x="365" y="306" text-anchor="middle" font-size="9" fill="#15803d">Station B</text>
    <circle cx="335" cy="270" r="6" fill="#16a34a"/>
    <text x="325" y="266" text-anchor="end" font-size="9" fill="#15803d">P2</text>

    <!-- Home position marker -->
    <circle cx="240" cy="110" r="8" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="252" y="114" font-size="10" fill="#6d28d9" font-weight="700">HOME</text>

    <!-- Dimension -->
    <line x1="240" y1="390" x2="390" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="385" x2="240" y2="395" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="390" y1="385" x2="390" y2="395" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="315" y="403" text-anchor="middle" font-size="10" fill="#64748b">~300 mm reach</text>

    <!-- Legend -->
    <rect x="46" y="340" width="150" height="70" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="121" y="356" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Legend</text>
    <rect x="54" y="362" width="12" height="8" rx="2" fill="#fef9c3" stroke="#f59e0b" stroke-width="1"/>
    <text x="72" y="370" font-size="9" fill="#475569">Operating envelope</text>
    <rect x="54" y="376" width="12" height="8" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
    <text x="72" y="384" font-size="9" fill="#475569">Dead zone</text>
    <line x1="54" y1="395" x2="66" y2="395" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="72" y="398" font-size="9" fill="#475569">Safety boundary</text>
  </g>
</svg>
