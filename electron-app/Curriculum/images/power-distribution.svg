<svg viewBox="0 0 560 384" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="560" height="384" fill="#f8fafc" rx="8"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Power Distribution</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#64748b">From mains supply to each subsystem</text>

  <!-- Mains PSU -->
  <rect x="200" y="54" width="160" height="58" rx="8" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <text x="280" y="75" text-anchor="middle" font-size="12" font-weight="700" fill="white">Power Supply Unit</text>
  <text x="280" y="91" text-anchor="middle" font-size="11" fill="#e2e8f0">110–230 V AC → 24 V DC</text>
  <text x="280" y="105" text-anchor="middle" font-size="10" fill="#cbd5e1">~2.75 A rated</text>

  <!-- 24 V into the distribution PCB -->
  <line x1="280" y1="112" x2="280" y2="160" stroke="#ef4444" stroke-width="3"/>
  <text x="290" y="132" font-size="12" fill="#dc2626" font-weight="700">24 V DC</text>

  <!-- Power distribution PCB (both regulators run from the 24 V input) -->
  <rect x="28" y="142" width="340" height="112" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="38" y="157" font-size="10" font-weight="700" fill="#475569">Power distribution PCB</text>
  <circle cx="280" cy="168" r="6" fill="#ef4444"/>
  <line x1="280" y1="168" x2="280" y2="183" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>
  <polyline points="280,168 100,168 100,183" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="40" y="188" width="120" height="56" rx="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
  <text x="100" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="white">12 V Regulator</text>
  <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#dbeafe">Buck converter</text>
  <text x="100" y="236" text-anchor="middle" font-size="10" fill="#eff6ff">24 V → 12 V</text>

  <rect x="210" y="188" width="140" height="56" rx="8" fill="#166534" stroke="#14532d" stroke-width="2"/>
  <text x="280" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="white">5 V Regulator</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#dcfce7">Buck converter</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#f0fdf4">24 V → 5 V</text>

  <!-- Output rails -->
  <line x1="100" y1="244" x2="100" y2="279" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="110" y="272" font-size="11" fill="#1d4ed8" font-weight="700">12 V</text>
  <line x1="280" y1="244" x2="280" y2="279" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="290" y="272" font-size="11" fill="#15803d" font-weight="700">5 V</text>

  <!-- Loads -->
  <rect x="40" y="284" width="120" height="56" rx="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
  <text x="100" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="white">Servo Bus</text>
  <text x="100" y="318" text-anchor="middle" font-size="10.5" fill="#dbeafe">12 V · up to 3 A</text>
  <text x="100" y="332" text-anchor="middle" font-size="10" fill="#eff6ff">ST3215 motors ×6</text>

  <rect x="210" y="284" width="140" height="56" rx="8" fill="#166534" stroke="#14532d" stroke-width="2"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="white">Onboard Computer</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#dcfce7">~3.5 W idle · ~8 W load</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#f0fdf4">Runs the control server</text>

  <rect x="400" y="284" width="120" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="308" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">RGB Indicator</text>
  <text x="460" y="323" text-anchor="middle" font-size="10" fill="#6d28d9">WS2812B LED strip</text>

  <!-- Data links from the onboard computer -->
  <line x1="210" y1="312" x2="166" y2="312" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="188" y="306" text-anchor="middle" font-size="9" fill="#6d28d9">UART</text>
  <line x1="350" y1="312" x2="394" y2="312" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="373" y="306" text-anchor="middle" font-size="9" fill="#6d28d9">LED data</text>

  <!-- Key + note -->
  <line x1="222" y1="358" x2="238" y2="358" stroke="#ef4444" stroke-width="2.5"/>
  <text x="243" y="361.5" font-size="10" fill="#475569">Power</text>
  <line x1="284" y1="358" x2="300" y2="358" stroke="#7c3aed" stroke-width="2"/>
  <text x="305" y="361.5" font-size="10" fill="#475569">Data</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#64748b">Servos draw peak current on startup or under heavy load - make sure the PSU is adequately rated.</text>
</svg>
