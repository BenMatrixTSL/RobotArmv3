<svg viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Torque (Moment) Diagram</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#64748b">M = F × d</text>

  <!-- Wall with hatching -->
  <rect x="40" y="80" width="20" height="180" rx="2" fill="#94a3b8"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="40" y1="80"  x2="20" y2="60"/>
    <line x1="40" y1="106" x2="20" y2="86"/>
    <line x1="40" y1="132" x2="20" y2="112"/>
    <line x1="40" y1="158" x2="20" y2="138"/>
    <line x1="40" y1="184" x2="20" y2="164"/>
    <line x1="40" y1="210" x2="20" y2="190"/>
    <line x1="40" y1="236" x2="20" y2="216"/>
    <line x1="40" y1="260" x2="20" y2="240"/>
  </g>

  <!-- Link / beam -->
  <rect x="66" y="160" width="306" height="20" rx="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Pivot / joint -->
  <circle cx="60" cy="170" r="14" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="60" cy="170" r="5" fill="#ffffff"/>
  <text x="80" y="198" font-size="10" fill="#1d4ed8">Pivot (joint)</text>

  <!-- Reaction torque: the motor pushes back anticlockwise against the load -->
  <path d="M 90.8,155.6 A 34,34 0 0,0 63,136.1" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arr-g)"/>
  <text x="100" y="130" font-size="12" fill="#166534" font-weight="700">M</text>
  <text x="114" y="130" font-size="10" fill="#166534">(reaction torque)</text>

  <!-- Force at the end of the beam -->
  <line x1="372" y1="124" x2="372" y2="152" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-r)"/>
  <text x="382" y="136" font-size="13" fill="#dc2626" font-weight="700">F</text>
  <text x="382" y="150" font-size="10" fill="#dc2626">(load)</text>

  <!-- Moment arm: pivot centre to line of action of F -->
  <line x1="60" y1="222" x2="372" y2="222" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="215" x2="60" y2="229" stroke="#475569" stroke-width="1.5"/>
  <line x1="372" y1="215" x2="372" y2="229" stroke="#475569" stroke-width="1.5"/>
  <text x="216" y="240" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="700" font-style="italic">d</text>
  <text x="216" y="253" text-anchor="middle" font-size="10" fill="#64748b">(moment arm)</text>

  <!-- Formula box -->
  <rect x="20" y="272" width="480" height="66" rx="8" fill="#0f172a"/>
  <text x="260" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#7dd3fc">M = F × d</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#bfdbfe">M = Moment (torque) in N·m</text>
  <text x="260" y="329" text-anchor="middle" font-size="11" fill="#bfdbfe">F = Applied force in newtons (N) · d = Moment arm in metres (m)</text>

  <!-- Example -->
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#475569">Example: F = 2 N at d = 0.15 m → M = 0.30 N·m</text>
  <text x="260" y="370" text-anchor="middle" font-size="10" fill="#64748b">(this is the torque the joint motor must overcome)</text>
</svg>
