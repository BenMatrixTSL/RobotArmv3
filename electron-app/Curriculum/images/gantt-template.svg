<svg viewBox="0 0 620 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="620" height="410" fill="#f8fafc" rx="8"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Project Gantt Chart - Template</text>
  <text x="310" y="40" text-anchor="middle" font-size="11" fill="#64748b">Fill in your task bars - shade cells for the weeks each task is active</text>

  <!-- Columns: task name x 20..160 (140), then 8 week cols of 55 → x 160..600. Rows: header y 60..90, 8 rows × 36 → y 90..378 -->
  <!-- Header row -->
  <rect x="20" y="60" width="140" height="30" fill="#1e293b"/>
  <text x="90" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="white">Task</text>
  <rect x="160" y="60" width="440" height="30" fill="#334155"/>
  <text x="187.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 1</text>
  <text x="242.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 2</text>
  <text x="297.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 3</text>
  <text x="352.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 4</text>
  <text x="407.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 5</text>
  <text x="462.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 6</text>
  <text x="517.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 7</text>
  <text x="572.5" y="79" text-anchor="middle" font-size="10" fill="white">Wk 8</text>

  <!-- Task rows with alternating background -->
  <rect x="20" y="90"  width="580" height="36" fill="white"   stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="126" width="580" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="162" width="580" height="36" fill="white"   stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="198" width="580" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="234" width="580" height="36" fill="white"   stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="270" width="580" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="306" width="580" height="36" fill="white"   stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="20" y="342" width="580" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- Vertical week dividers -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="215" y1="90" x2="215" y2="378"/>
    <line x1="270" y1="90" x2="270" y2="378"/>
    <line x1="325" y1="90" x2="325" y2="378"/>
    <line x1="380" y1="90" x2="380" y2="378"/>
    <line x1="435" y1="90" x2="435" y2="378"/>
    <line x1="490" y1="90" x2="490" y2="378"/>
    <line x1="545" y1="90" x2="545" y2="378"/>
  </g>
  <!-- Task name column divider -->
  <line x1="160" y1="60" x2="160" y2="378" stroke="#334155" stroke-width="1.5"/>

  <!-- Task names -->
  <text x="30" y="112" font-size="10" fill="#475569">1. Brief &amp; Research</text>
  <text x="30" y="148" font-size="10" fill="#475569">2. Write Specification</text>
  <text x="30" y="184" font-size="10" fill="#475569">3. Design &amp; Plan</text>
  <text x="30" y="220" font-size="10" fill="#475569">4. Build / Program</text>
  <text x="30" y="256" font-size="10" fill="#475569">5. Test &amp; Debug</text>
  <text x="30" y="292" font-size="10" fill="#475569">6. Document</text>
  <text x="30" y="328" font-size="10" fill="#475569">7. Evaluate</text>
  <text x="30" y="364" font-size="10" fill="#475569">8. Present</text>

  <!-- Example bars (inset 3 px from the week borders) -->
  <!-- Row 1: Wk1-2 -->
  <rect x="163" y="97" width="104" height="22" rx="4" fill="#2563eb"/>
  <text x="215" y="111.5" text-anchor="middle" font-size="9" fill="white">Research</text>
  <!-- Row 2: Wk2-3 -->
  <rect x="218" y="133" width="104" height="22" rx="4" fill="#7c3aed"/>
  <text x="270" y="147.5" text-anchor="middle" font-size="9" fill="white">Spec</text>
  <!-- Row 3: Wk3-4 -->
  <rect x="273" y="169" width="104" height="22" rx="4" fill="#ea580c"/>
  <text x="325" y="183.5" text-anchor="middle" font-size="9" fill="white">Design</text>
  <!-- Row 4: Wk4-6 -->
  <rect x="328" y="205" width="159" height="22" rx="4" fill="#16a34a"/>
  <text x="414" y="219.5" text-anchor="middle" font-size="9" fill="white">Build &amp; Program</text>
  <!-- Row 5: Wk5-7 -->
  <rect x="383" y="241" width="159" height="22" rx="4" fill="#0369a1"/>
  <text x="462.5" y="255.5" text-anchor="middle" font-size="9" fill="white">Test &amp; Debug</text>
  <!-- Row 6: Wk5-6 -->
  <rect x="383" y="277" width="104" height="22" rx="4" fill="#a16207"/>
  <text x="435" y="291.5" text-anchor="middle" font-size="9" fill="white">Document</text>
  <!-- Row 7: Wk7 -->
  <rect x="493" y="313" width="49" height="22" rx="4" fill="#dc2626"/>
  <text x="517.5" y="327.5" text-anchor="middle" font-size="9" fill="white">Evaluate</text>
  <!-- Row 8: Wk8 -->
  <rect x="548" y="349" width="49" height="22" rx="4" fill="#475569"/>
  <text x="572.5" y="363.5" text-anchor="middle" font-size="9" fill="white">Present</text>

  <!-- Today marker (middle of week 4) -->
  <line x1="352.5" y1="90" x2="352.5" y2="378" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <polygon points="347.5,90 357.5,90 352.5,96" fill="#ef4444"/>
  <text x="352.5" y="55" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">Today</text>

  <text x="310" y="396" text-anchor="middle" font-size="10" fill="#64748b">Overlapping bars (rows 4-6) show parallel tasks - efficient project scheduling. Adapt this template for your own project.</text>
</svg>
