<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#f8fafc" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Pose-Dependent Loading</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#64748b">Same payload - different torque demand depending on arm extension</text>

  <!-- === POSE A: Fully extended === -->
  <text x="93" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Fully Extended</text>
  <text x="93" y="84" text-anchor="middle" font-size="10" fill="#dc2626">HIGH torque</text>
  <rect x="60" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <line x1="93" y1="310" x2="93" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <line x1="93" y1="220" x2="173" y2="220" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="93" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="93" cy="220" r="8" fill="#7c3aed"/>
  <rect x="163" y="210" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <line x1="173" y1="186" x2="173" y2="204" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-r)"/>
  <text x="182" y="198" font-size="11" fill="#dc2626" font-weight="700">F</text>
  <!-- Moment arm: horizontal distance from base joint to the line of force -->
  <line x1="93" y1="344" x2="173" y2="344" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="93" y1="339" x2="93" y2="349" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="173" y1="339" x2="173" y2="349" stroke="#dc2626" stroke-width="1.5"/>
  <text x="133" y="360" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">d = large</text>
  <!-- Load bar (85%) -->
  <rect x="48" y="368" width="90" height="10" rx="3" fill="#fecaca"/>
  <rect x="48" y="368" width="76.5" height="10" rx="3" fill="#dc2626"/>
  <text x="93" y="392" text-anchor="middle" font-size="9" fill="#b91c1c">~85% torque</text>

  <!-- === POSE B: Mid extension === -->
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">Mid Extension</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#b45309">MEDIUM torque</text>
  <rect x="247" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <line x1="280" y1="310" x2="280" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <line x1="280" y1="220" x2="337" y2="163" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="280" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="280" cy="220" r="8" fill="#7c3aed"/>
  <rect x="327" y="153" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <line x1="337" y1="129" x2="337" y2="147" stroke="#d97706" stroke-width="3" marker-end="url(#arr-o)"/>
  <text x="346" y="141" font-size="11" fill="#b45309" font-weight="700">F</text>
  <line x1="280" y1="344" x2="337" y2="344" stroke="#d97706" stroke-width="1.5"/>
  <line x1="280" y1="339" x2="280" y2="349" stroke="#d97706" stroke-width="1.5"/>
  <line x1="337" y1="339" x2="337" y2="349" stroke="#d97706" stroke-width="1.5"/>
  <text x="308.5" y="360" text-anchor="middle" font-size="10" fill="#b45309" font-weight="700">d = medium</text>
  <!-- Load bar (55%) -->
  <rect x="235" y="368" width="90" height="10" rx="3" fill="#fef3c7"/>
  <rect x="235" y="368" width="49.5" height="10" rx="3" fill="#f59e0b"/>
  <text x="280" y="392" text-anchor="middle" font-size="9" fill="#b45309">~55% torque</text>

  <!-- === POSE C: Retracted (vertical) === -->
  <text x="460" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Retracted / Upright</text>
  <text x="460" y="84" text-anchor="middle" font-size="10" fill="#15803d">LOW torque</text>
  <rect x="427" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <line x1="460" y1="310" x2="460" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <line x1="460" y1="220" x2="460" y2="150" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="460" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="460" cy="220" r="8" fill="#7c3aed"/>
  <rect x="450" y="130" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <line x1="460" y1="106" x2="460" y2="124" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-g)"/>
  <text x="469" y="118" font-size="11" fill="#15803d" font-weight="700">F</text>
  <text x="484" y="150" font-size="10" fill="#166534">Force passes</text>
  <text x="484" y="163" font-size="10" fill="#166534">through joint</text>
  <text x="484" y="176" font-size="10" fill="#166534">→ d ≈ 0</text>
  <line x1="460" y1="339" x2="460" y2="349" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="360" text-anchor="middle" font-size="10" fill="#15803d" font-weight="700">d ≈ 0</text>
  <!-- Load bar (15%) -->
  <rect x="415" y="368" width="90" height="10" rx="3" fill="#dcfce7"/>
  <rect x="415" y="368" width="13.5" height="10" rx="3" fill="#16a34a"/>
  <text x="460" y="392" text-anchor="middle" font-size="9" fill="#15803d">~15% torque</text>
</svg>
