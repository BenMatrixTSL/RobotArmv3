<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#f8fafc" rx="8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Pose-Dependent Loading</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#64748b">Same payload — different torque demand depending on arm extension</text>

  <!-- === POSE A: Fully extended === -->
  <text x="93" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Fully Extended</text>
  <text x="93" y="84" text-anchor="middle" font-size="10" fill="#dc2626">HIGH torque</text>
  <!-- Base -->
  <rect x="60" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <circle cx="93" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Link 1 -->
  <line x1="93" y1="310" x2="93" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <!-- Link 2 - extended horizontally -->
  <line x1="93" y1="220" x2="173" y2="220" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="93" cy="220" r="8" fill="#7c3aed"/>
  <!-- Payload -->
  <rect x="163" y="210" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Force arrow -->
  <line x1="173" y1="195" x2="173" y2="209" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-r)"/>
  <text x="185" y="200" font-size="11" fill="#dc2626" font-weight="700">F</text>
  <!-- Moment arm arrow -->
  <line x1="93" y1="340" x2="173" y2="340" stroke="#dc2626" stroke-width="1.5"/>
  <text x="133" y="355" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">d = large</text>
  <!-- Load bar -->
  <rect x="60" y="360" width="66" height="12" rx="3" fill="#fecaca"/>
  <rect x="60" y="360" width="63" height="12" rx="3" fill="#dc2626"/>
  <text x="93" y="371" text-anchor="middle" font-size="9" fill="white">~85% torque</text>

  <!-- === POSE B: Mid extension === -->
  <text x="280" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#f59e0b">Mid Extension</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#f59e0b">MEDIUM torque</text>
  <rect x="247" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <circle cx="280" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Link 1 -->
  <line x1="280" y1="310" x2="280" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <!-- Link 2 - 45° angle -->
  <line x1="280" y1="220" x2="337" y2="163" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="280" cy="220" r="8" fill="#7c3aed"/>
  <!-- Payload -->
  <rect x="327" y="153" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Force arrow -->
  <line x1="337" y1="138" x2="337" y2="152" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr-r)"/>
  <!-- Moment arm arrow -->
  <line x1="280" y1="340" x2="337" y2="340" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="308" y="355" text-anchor="middle" font-size="10" fill="#f59e0b" font-weight="700">d = medium</text>
  <!-- Load bar -->
  <rect x="247" y="360" width="66" height="12" rx="3" fill="#fef3c7"/>
  <rect x="247" y="360" width="42" height="12" rx="3" fill="#f59e0b"/>
  <text x="280" y="371" text-anchor="middle" font-size="9" fill="white">~55%</text>

  <!-- === POSE C: Retracted (vertical) === -->
  <text x="460" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Retracted / Upright</text>
  <text x="460" y="84" text-anchor="middle" font-size="10" fill="#16a34a">LOW torque</text>
  <rect x="427" y="320" width="66" height="16" rx="3" fill="#475569"/>
  <circle cx="460" cy="320" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- Link 1 -->
  <line x1="460" y1="310" x2="460" y2="220" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <!-- Link 2 - vertical (upward) -->
  <line x1="460" y1="220" x2="460" y2="150" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="460" cy="220" r="8" fill="#7c3aed"/>
  <!-- Payload -->
  <rect x="450" y="130" width="20" height="20" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Force arrow -->
  <line x1="460" y1="115" x2="460" y2="129" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-r)"/>
  <!-- Note -->
  <text x="490" y="145" font-size="10" fill="#166534">Force passes</text>
  <text x="490" y="158" font-size="10" fill="#166534">through joint</text>
  <text x="490" y="171" font-size="10" fill="#166534">→ d ≈ 0</text>
  <!-- Moment arm -->
  <line x1="427" y1="340" x2="493" y2="340" stroke="#16a34a" stroke-width="1.5"/>
  <text x="460" y="355" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">d ≈ 0</text>
  <!-- Load bar -->
  <rect x="427" y="360" width="66" height="12" rx="3" fill="#dcfce7"/>
  <rect x="427" y="360" width="10" height="12" rx="3" fill="#16a34a"/>
  <text x="460" y="371" text-anchor="middle" font-size="9" fill="#166534">~15%</text>
</svg>
