<svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="520" height="360" fill="#f8fafc" rx="8"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Gear Reduction &amp; Gear Ratio</text>

  <!-- Driver (small) gear -->
  <circle cx="155" cy="180" r="55" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="155" cy="180" r="45" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="155" cy="180" r="10" fill="#3b82f6"/>
  <!-- Gear teeth (driver) - 10 teeth -->
  <g stroke="#3b82f6" stroke-width="3" fill="none">
    <line x1="155" y1="122" x2="155" y2="110"/>
    <line x1="177" y1="128" x2="184" y2="117"/>
    <line x1="193" y1="145" x2="202" y2="138"/>
    <line x1="198" y1="169" x2="210" y2="169"/>
    <line x1="191" y1="193" x2="200" y2="200"/>
    <line x1="175" y1="208" x2="182" y2="219"/>
    <line x1="155" y1="213" x2="155" y2="225"/>
    <line x1="133" y1="208" x2="126" y2="219"/>
    <line x1="117" y1="193" x2="108" y2="200"/>
    <line x1="110" y1="169" x2="98"  y2="169"/>
    <line x1="117" y1="145" x2="108" y2="138"/>
    <line x1="133" y1="128" x2="126" y2="117"/>
  </g>
  <text x="155" y="185" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="700">Driver</text>
  <text x="155" y="270" text-anchor="middle" font-size="11" fill="#3b82f6">12 teeth</text>
  <text x="155" y="285" text-anchor="middle" font-size="10" fill="#64748b">Input (motor)</text>

  <!-- Rotation arrow on driver -->
  <path d="M 155,122 A 58,58 0 0,1 205,155" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="205,155 212,145 200,148" fill="#3b82f6"/>
  <text x="208" y="140" font-size="10" fill="#3b82f6">fast</text>

  <!-- Driven (large) gear -->
  <circle cx="348" cy="180" r="110" fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="348" cy="180" r="98" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <circle cx="348" cy="180" r="14" fill="#ea580c"/>
  <!-- Gear teeth (driven) - fewer, larger -->
  <g stroke="#ea580c" stroke-width="3" fill="none">
    <line x1="348" y1="67" x2="348" y2="50"/>
    <line x1="390" y1="80" x2="402" y2="66"/>
    <line x1="422" y1="113" x2="436" y2="103"/>
    <line x1="446" y1="157" x2="462" y2="157"/>
    <line x1="440" y1="202" x2="455" y2="210"/>
    <line x1="415" y1="240" x2="427" y2="252"/>
    <line x1="376" y1="263" x2="384" y2="278"/>
    <line x1="348" y1="268" x2="348" y2="285"/>
    <line x1="318" y1="263" x2="310" y2="278"/>
    <line x1="279" y1="248" x2="267" y2="260"/>
    <line x1="252" y1="222" x2="238" y2="230"/>
    <line x1="237" y1="186" x2="222" y2="186"/>
    <line x1="244" y1="147" x2="230" y2="140"/>
    <line x1="265" y1="113" x2="253" y2="102"/>
    <line x1="300" y1="83" x2="290" y2="70"/>
  </g>
  <text x="348" y="186" text-anchor="middle" font-size="11" fill="#c2410c" font-weight="700">Driven</text>
  <text x="348" y="310" text-anchor="middle" font-size="11" fill="#ea580c">48 teeth</text>
  <text x="348" y="325" text-anchor="middle" font-size="10" fill="#64748b">Output (joint)</text>

  <!-- Rotation arrow on driven (opposite direction) -->
  <path d="M 348,67 A 113,113 0 0,0 240,130" stroke="#ea580c" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <polygon points="240,130 228,128 234,140" fill="#ea580c"/>
  <text x="222" y="120" font-size="10" fill="#ea580c">slow</text>

  <!-- Mesh point -->
  <circle cx="210" cy="180" r="5" fill="#475569"/>

  <!-- Formula box -->
  <rect x="20" y="295" width="480" height="52" rx="8" fill="#0f172a"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#7dd3fc">Gear Ratio = Driven teeth ÷ Driver teeth = 48 ÷ 12 = 4 : 1</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#93c5fd">Output torque × 4  ·  Output speed ÷ 4  ·  Useful for high-torque, low-speed joint actuation</text>
</svg>
