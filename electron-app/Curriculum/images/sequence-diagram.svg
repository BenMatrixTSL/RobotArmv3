<svg viewBox="0 0 580 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="580" height="340" fill="#f8fafc" rx="8"/>
  <text x="290" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Pick-and-Place Sequence Diagram</text>
  <text x="290" y="40" text-anchor="middle" font-size="11" fill="#64748b">One complete cycle — HOME → PICK → PLACE → HOME</text>

  <!-- Timeline axis -->
  <line x1="40" y1="80" x2="560" y2="80" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="76" text-anchor="end" font-size="10" fill="#64748b">Time →</text>

  <!-- Time markers -->
  <text x="60"  y="75" text-anchor="middle" font-size="9" fill="#94a3b8">0 s</text>
  <text x="155" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">2 s</text>
  <text x="230" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">4 s</text>
  <text x="310" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">6 s</text>
  <text x="390" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">8 s</text>
  <text x="470" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">10 s</text>
  <text x="555" y="75" text-anchor="middle" font-size="9" fill="#94a3b8">12 s</text>

  <!-- Row labels -->
  <text x="30" y="118" text-anchor="end" font-size="10" fill="#64748b">G28</text>
  <text x="30" y="128" text-anchor="end" font-size="9"  fill="#94a3b8">Home</text>
  <text x="30" y="158" text-anchor="end" font-size="10" fill="#64748b">Pick</text>
  <text x="30" y="168" text-anchor="end" font-size="9"  fill="#94a3b8">Above</text>
  <text x="30" y="198" text-anchor="end" font-size="10" fill="#64748b">Pick</text>
  <text x="30" y="208" text-anchor="end" font-size="9"  fill="#94a3b8">Point</text>
  <text x="30" y="240" text-anchor="end" font-size="9"  fill="#64748b">Gripper</text>
  <text x="30" y="250" text-anchor="end" font-size="9"  fill="#94a3b8">Dwell</text>
  <text x="30" y="278" text-anchor="end" font-size="10" fill="#64748b">Place</text>
  <text x="30" y="288" text-anchor="end" font-size="9"  fill="#94a3b8">Above</text>
  <text x="30" y="313" text-anchor="end" font-size="10" fill="#64748b">Place</text>
  <text x="30" y="323" text-anchor="end" font-size="9"  fill="#94a3b8">Point</text>

  <!-- Bars -->
  <!-- G28 Home: 0-2s -->
  <rect x="40"  y="105" width="115" height="20" rx="4" fill="#475569"/>
  <text x="97"  y="119" text-anchor="middle" font-size="9" fill="white">Move to Home (G28)</text>

  <!-- Pick Above: 2-4s -->
  <rect x="155" y="145" width="115" height="20" rx="4" fill="#3b82f6"/>
  <text x="212" y="159" text-anchor="middle" font-size="9" fill="white">Move to Pick Above</text>

  <!-- Pick: 4-6s -->
  <rect x="230" y="185" width="80"  height="20" rx="4" fill="#7c3aed"/>
  <text x="270" y="199" text-anchor="middle" font-size="9" fill="white">Lower to Pick</text>

  <!-- Gripper dwell: 6-7s -->
  <rect x="310" y="227" width="40"  height="20" rx="4" fill="#ca8a04"/>
  <text x="330" y="241" text-anchor="middle" font-size="9" fill="white">G04</text>

  <!-- Lift back up: 7-8s (Pick Above again) -->
  <rect x="350" y="145" width="40"  height="20" rx="4" fill="#3b82f6" fill-opacity="0.6"/>
  <text x="370" y="159" text-anchor="middle" font-size="9" fill="white">Lift</text>

  <!-- Swing to Place Above: 8-10s -->
  <rect x="390" y="265" width="110" height="20" rx="4" fill="#16a34a"/>
  <text x="445" y="279" text-anchor="middle" font-size="9" fill="white">Swing to Place Above</text>

  <!-- Place: 10-11s -->
  <rect x="470" y="300" width="50"  height="20" rx="4" fill="#ea580c"/>
  <text x="495" y="314" text-anchor="middle" font-size="9" fill="white">Lower</text>

  <!-- Gripper release + home: 11-12s -->
  <rect x="510" y="105" width="45"  height="20" rx="4" fill="#475569"/>
  <text x="532" y="119" text-anchor="middle" font-size="9" fill="white">Home</text>

  <!-- Connector lines (flow) -->
  <line x1="155" y1="115" x2="155" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="230" y1="155" x2="230" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="310" y1="195" x2="310" y2="227" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="350" y1="237" x2="350" y2="155" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="390" y1="155" x2="390" y2="265" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="470" y1="275" x2="470" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="510" y1="310" x2="510" y2="115" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Cycle time brace -->
  <line x1="40"  y1="335" x2="555" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="40"  y1="330" x2="40"  y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="555" y1="330" x2="555" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <text x="297" y="332" text-anchor="middle" font-size="10" fill="#64748b" font-weight="700">Cycle time ≈ 12 s (at 50% speed)</text>
</svg>
