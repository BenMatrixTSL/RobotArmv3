<svg viewBox="0 0 580 345" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="580" height="345" fill="#f8fafc" rx="8"/>
  <text x="290" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Pick-and-Place Sequence Diagram</text>
  <text x="290" y="40" text-anchor="middle" font-size="11" fill="#64748b">One complete cycle - HOME → PICK → PLACE → HOME</text>

  <!-- Time scale: x = 90 + 39 × seconds (0 s = 90, 12 s = 558) -->
  <g stroke="#e8edf3" stroke-width="1">
    <line x1="90"  y1="72" x2="90"  y2="290"/>
    <line x1="168" y1="72" x2="168" y2="290"/>
    <line x1="246" y1="72" x2="246" y2="290"/>
    <line x1="324" y1="72" x2="324" y2="290"/>
    <line x1="402" y1="72" x2="402" y2="290"/>
    <line x1="480" y1="72" x2="480" y2="290"/>
    <line x1="558" y1="72" x2="558" y2="290"/>
  </g>
  <line x1="90" y1="72" x2="558" y2="72" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="74" y="69" text-anchor="end" font-size="10" fill="#64748b">Time →</text>
  <text x="90"  y="66" text-anchor="middle" font-size="9" fill="#64748b">0 s</text>
  <text x="168" y="66" text-anchor="middle" font-size="9" fill="#64748b">2 s</text>
  <text x="246" y="66" text-anchor="middle" font-size="9" fill="#64748b">4 s</text>
  <text x="324" y="66" text-anchor="middle" font-size="9" fill="#64748b">6 s</text>
  <text x="402" y="66" text-anchor="middle" font-size="9" fill="#64748b">8 s</text>
  <text x="480" y="66" text-anchor="middle" font-size="9" fill="#64748b">10 s</text>
  <text x="558" y="66" text-anchor="middle" font-size="9" fill="#64748b">12 s</text>

  <!-- Row labels (row centres y = 100, 135, 170, 205, 240, 275) -->
  <text x="74" y="99"  text-anchor="end" font-size="10" fill="#475569">G28</text>
  <text x="74" y="110" text-anchor="end" font-size="9"  fill="#64748b">Home</text>
  <text x="74" y="134" text-anchor="end" font-size="10" fill="#475569">Pick</text>
  <text x="74" y="145" text-anchor="end" font-size="9"  fill="#64748b">Above</text>
  <text x="74" y="169" text-anchor="end" font-size="10" fill="#475569">Pick</text>
  <text x="74" y="180" text-anchor="end" font-size="9"  fill="#64748b">Point</text>
  <text x="74" y="204" text-anchor="end" font-size="10" fill="#475569">Gripper</text>
  <text x="74" y="215" text-anchor="end" font-size="9"  fill="#64748b">G04 dwell</text>
  <text x="74" y="239" text-anchor="end" font-size="10" fill="#475569">Place</text>
  <text x="74" y="250" text-anchor="end" font-size="9"  fill="#64748b">Above</text>
  <text x="74" y="274" text-anchor="end" font-size="10" fill="#475569">Place</text>
  <text x="74" y="285" text-anchor="end" font-size="9"  fill="#64748b">Point</text>

  <!-- Connector lines: each step starts where the previous one ends -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2">
    <line x1="168"   y1="110" x2="168"   y2="125"/>
    <line x1="246"   y1="145" x2="246"   y2="160"/>
    <line x1="304.5" y1="180" x2="304.5" y2="195"/>
    <line x1="343.5" y1="195" x2="343.5" y2="145"/>
    <line x1="382.5" y1="145" x2="382.5" y2="230"/>
    <line x1="460.5" y1="250" x2="460.5" y2="265"/>
    <line x1="499.5" y1="265" x2="499.5" y2="110"/>
  </g>

  <!-- Bars -->
  <!-- 0-2 s: home -->
  <rect x="90" y="90" width="78" height="20" rx="4" fill="#475569"/>
  <text x="129" y="103.5" text-anchor="middle" font-size="9" fill="white">Move home</text>
  <!-- 2-4 s: to pick above -->
  <rect x="168" y="125" width="78" height="20" rx="4" fill="#2563eb"/>
  <text x="207" y="138.5" text-anchor="middle" font-size="9" fill="white">Approach</text>
  <!-- 4-5.5 s: lower to pick -->
  <rect x="246" y="160" width="58.5" height="20" rx="4" fill="#7c3aed"/>
  <text x="275.3" y="173.5" text-anchor="middle" font-size="9" fill="white">Lower</text>
  <!-- 5.5-6.5 s: grip dwell -->
  <rect x="304.5" y="195" width="39" height="20" rx="4" fill="#a16207"/>
  <text x="324" y="208.5" text-anchor="middle" font-size="9" fill="white">Grip</text>
  <!-- 6.5-7.5 s: lift back to pick above -->
  <rect x="343.5" y="125" width="39" height="20" rx="4" fill="#3b82f6"/>
  <text x="363" y="138.5" text-anchor="middle" font-size="9" fill="white">Lift</text>
  <!-- 7.5-9.5 s: swing to place above -->
  <rect x="382.5" y="230" width="78" height="20" rx="4" fill="#16a34a"/>
  <text x="421.5" y="243.5" text-anchor="middle" font-size="9" fill="white">Swing over</text>
  <!-- 9.5-10.5 s: lower and release -->
  <rect x="460.5" y="265" width="39" height="20" rx="4" fill="#ea580c"/>
  <text x="480" y="278.5" text-anchor="middle" font-size="9" fill="white">Lower</text>
  <!-- 10.5-12 s: back home -->
  <rect x="499.5" y="90" width="58.5" height="20" rx="4" fill="#475569"/>
  <text x="528.8" y="103.5" text-anchor="middle" font-size="9" fill="white">Home</text>

  <!-- Cycle time brace -->
  <line x1="90"  y1="308" x2="558" y2="308" stroke="#64748b" stroke-width="1.5"/>
  <line x1="90"  y1="302" x2="90"  y2="314" stroke="#64748b" stroke-width="1.5"/>
  <line x1="558" y1="302" x2="558" y2="314" stroke="#64748b" stroke-width="1.5"/>
  <text x="324" y="330" text-anchor="middle" font-size="10" fill="#475569" font-weight="700">Cycle time ≈ 12 s (at 50% speed)</text>
</svg>
