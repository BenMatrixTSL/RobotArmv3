<svg viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="500" height="420" fill="#f8fafc" rx="8"/>
  <text x="250" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Pick-and-Place G-code Program Logic</text>
  <text x="250" y="38" text-anchor="middle" font-size="10" fill="#64748b">Flowchart showing the structure of a G-code pick-and-place routine</text>

  <!-- START -->
  <rect x="175" y="50" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="250" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="white">START PROGRAM</text>
  <line x1="250" y1="82" x2="250" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- G90 absolute mode -->
  <rect x="155" y="96" width="190" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="110" text-anchor="middle" font-size="10" fill="#1e293b">G90 — Set absolute positioning</text>
  <text x="250" y="122" text-anchor="middle" font-size="9" fill="#64748b">(all positions from origin, not current)</text>
  <line x1="250" y1="128" x2="250" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- G28 Home -->
  <rect x="155" y="142" width="190" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="158" text-anchor="middle" font-size="10" fill="#1e293b">G28 — Move to home position</text>
  <text x="250" y="170" text-anchor="middle" font-size="9" fill="#64748b">(all joints to reference / zero)</text>
  <line x1="250" y1="174" x2="250" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Loop start -->
  <rect x="175" y="188" width="150" height="28" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">── CYCLE LOOP ──</text>
  <line x1="250" y1="216" x2="250" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Move to Pick Above -->
  <rect x="140" y="230" width="220" height="28" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="250" y="248" text-anchor="middle" font-size="10" fill="#1e293b">G01 X_PA Y_PA Z_SAFE F50 — Move to Pick-Above</text>
  <line x1="250" y1="258" x2="250" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Move down to Pick -->
  <rect x="140" y="272" width="220" height="28" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="250" y="290" text-anchor="middle" font-size="10" fill="#1e293b">G01 Z_PICK F30 — Lower to pick point</text>
  <line x1="250" y1="300" x2="250" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- G04 Dwell -->
  <rect x="170" y="314" width="160" height="28" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="250" y="330" text-anchor="middle" font-size="10" fill="#1e293b">G04 P500 — Dwell 0.5 s (grip)</text>
  <line x1="250" y1="342" x2="250" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Move to Place Above -->
  <rect x="140" y="356" width="220" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="250" y="374" text-anchor="middle" font-size="10" fill="#1e293b">G01 X_PL Y_PL Z_SAFE F50 — Move to Place-Above</text>
  <line x1="360" y1="370" x2="384" y2="370" stroke="#475569" stroke-width="1.5"/>

  <!-- Right side: continuation -->
  <line x1="384" y1="370" x2="384" y2="242" stroke="#475569" stroke-width="1.5"/>
  <line x1="384" y1="242" x2="370" y2="242" stroke="#475569" stroke-width="1.5"/>
  <text x="430" y="310" text-anchor="middle" font-size="9" fill="#64748b">…place</text>
  <text x="430" y="322" text-anchor="middle" font-size="9" fill="#64748b">lower →</text>
  <text x="430" y="334" text-anchor="middle" font-size="9" fill="#64748b">dwell →</text>
  <text x="430" y="346" text-anchor="middle" font-size="9" fill="#64748b">lift →</text>
  <text x="430" y="358" text-anchor="middle" font-size="9" fill="#64748b">repeat</text>

  <!-- Loop back arrow -->
  <line x1="140" y1="202" x2="90" y2="202" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90"  y1="202" x2="90"  y2="370" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90"  y1="370" x2="140" y2="370" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="60" y="290" text-anchor="middle" font-size="8" fill="#7c3aed" transform="rotate(-90,60,290)">Loop N times</text>

  <!-- Code snippet side panel -->
  <rect x="410" y="50" width="84" height="176" rx="6" fill="#1e293b"/>
  <text x="452" y="66" text-anchor="middle" font-size="9" font-weight="700" fill="#f59e0b">G-code</text>
  <text x="418" y="82"  font-size="8" fill="#86efac">G90</text>
  <text x="418" y="94"  font-size="8" fill="#93c5fd">G28</text>
  <text x="418" y="112" font-size="8" fill="#fca5a5">; cycle</text>
  <text x="418" y="124" font-size="8" fill="#93c5fd">G01 X.. Z_SAFE</text>
  <text x="418" y="136" font-size="8" fill="#93c5fd">G01 Z_PICK</text>
  <text x="418" y="148" font-size="8" fill="#fde68a">G04 P500</text>
  <text x="418" y="160" font-size="8" fill="#86efac">G01 X.. Z_SAFE</text>
  <text x="418" y="172" font-size="8" fill="#86efac">G01 Z_PLACE</text>
  <text x="418" y="184" font-size="8" fill="#fde68a">G04 P500</text>
  <text x="418" y="196" font-size="8" fill="#d1d5db">G28</text>
  <text x="418" y="212" font-size="8" fill="#f87171">M30</text>
  <text x="452" y="232" text-anchor="middle" font-size="8" fill="#64748b">M30 = end</text>
</svg>
