<svg viewBox="0 0 540 570" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="540" height="570" fill="#f8fafc" rx="8"/>
  <text x="270" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Pick-and-Place G-code Program Logic</text>
  <text x="270" y="38" text-anchor="middle" font-size="10" fill="#64748b">Flowchart showing the structure of a G-code pick-and-place routine</text>

  <!-- Main column centred on x=230; boxes 220 wide (120..340), 32 high, 14 apart -->

  <!-- START -->
  <rect x="155" y="50" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="230" y="70.5" text-anchor="middle" font-size="12" font-weight="700" fill="white">START PROGRAM</text>

  <!-- Setup -->
  <rect x="120" y="96" width="220" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="109" text-anchor="middle" font-size="10" fill="#1e293b">G90 - Set absolute positioning</text>
  <text x="230" y="122" text-anchor="middle" font-size="9" fill="#64748b">(all positions from origin, not current)</text>

  <rect x="120" y="142" width="220" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="155" text-anchor="middle" font-size="10" fill="#1e293b">G28 - Move to home position</text>
  <text x="230" y="168" text-anchor="middle" font-size="9" fill="#64748b">(all joints to reference / zero)</text>

  <!-- Loop start -->
  <rect x="155" y="188" width="150" height="28" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="206" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">CYCLE START</text>

  <!-- Pick -->
  <rect x="120" y="230" width="220" height="32" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="230" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">G01 X_PA Y_PA Z_SAFE F50</text>
  <text x="230" y="256" text-anchor="middle" font-size="9" fill="#64748b">Move above the pick point</text>

  <rect x="120" y="276" width="220" height="32" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="230" y="289" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">G01 Z_PICK F30</text>
  <text x="230" y="302" text-anchor="middle" font-size="9" fill="#64748b">Lower to the pick point</text>

  <rect x="120" y="322" width="220" height="32" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="230" y="335" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">G04 P500</text>
  <text x="230" y="348" text-anchor="middle" font-size="9" fill="#64748b">Dwell 0.5 s while gripping</text>

  <!-- Place -->
  <rect x="120" y="368" width="220" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="381" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">G01 X_PL Y_PL Z_SAFE F50</text>
  <text x="230" y="394" text-anchor="middle" font-size="9" fill="#64748b">Lift and move above the place point</text>

  <rect x="120" y="414" width="220" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="427" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">G01 Z_PLACE · G04 P500 · G01 Z_SAFE</text>
  <text x="230" y="440" text-anchor="middle" font-size="9" fill="#64748b">Lower, release, lift</text>

  <!-- Decision -->
  <polygon points="230,458 300,482 230,506 160,482" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="230" y="486" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">More parts?</text>

  <!-- END -->
  <rect x="155" y="524" width="150" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="230" y="543.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">G28 · M30 - END</text>

  <!-- Flow arrows down the main column -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="230" y1="82"  x2="230" y2="92"/>
    <line x1="230" y1="128" x2="230" y2="138"/>
    <line x1="230" y1="174" x2="230" y2="184"/>
    <line x1="230" y1="216" x2="230" y2="226"/>
    <line x1="230" y1="262" x2="230" y2="272"/>
    <line x1="230" y1="308" x2="230" y2="318"/>
    <line x1="230" y1="354" x2="230" y2="364"/>
    <line x1="230" y1="400" x2="230" y2="410"/>
    <line x1="230" y1="446" x2="230" y2="454"/>
    <line x1="230" y1="506" x2="230" y2="520"/>
  </g>
  <text x="238" y="517" font-size="9" font-weight="700" fill="#475569">No</text>

  <!-- Loop back: Yes → CYCLE START -->
  <polyline points="160,482 70,482 70,202 151,202" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>
  <text x="118" y="476" text-anchor="middle" font-size="9" font-weight="700" fill="#7c3aed">Yes</text>
  <text x="58" y="342" text-anchor="middle" font-size="9" fill="#7c3aed" transform="rotate(-90,58,342)">Loop N times</text>

  <!-- Code side panel -->
  <rect x="372" y="50" width="156" height="206" rx="6" fill="#1e293b"/>
  <text x="450" y="67" text-anchor="middle" font-size="10" font-weight="700" fill="#fbbf24">G-code</text>
  <g font-size="8.5" font-family="ui-monospace, Consolas, monospace">
    <text x="382" y="86"  fill="#86efac">G90</text>
    <text x="382" y="99"  fill="#93c5fd">G28</text>
    <text x="382" y="114" fill="#fca5a5">; cycle start</text>
    <text x="382" y="127" fill="#fdba74">G01 X_PA Y_PA Z_SAFE</text>
    <text x="382" y="140" fill="#fdba74">G01 Z_PICK</text>
    <text x="382" y="153" fill="#fde68a">G04 P500</text>
    <text x="382" y="166" fill="#86efac">G01 X_PL Y_PL Z_SAFE</text>
    <text x="382" y="179" fill="#86efac">G01 Z_PLACE</text>
    <text x="382" y="192" fill="#fde68a">G04 P500</text>
    <text x="382" y="205" fill="#86efac">G01 Z_SAFE</text>
    <text x="382" y="220" fill="#fca5a5">; repeat for N parts</text>
    <text x="382" y="235" fill="#93c5fd">G28</text>
    <text x="382" y="248" fill="#f87171">M30  ; end</text>
  </g>
</svg>
