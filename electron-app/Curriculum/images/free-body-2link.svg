<svg viewBox="0 0 520 275" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#dc2626"/></marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#ea580c"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#3b82f6"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="520" height="275" fill="#f8fafc" rx="8"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Free Body Diagram - 2-Link Arm</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#64748b">Reaction forces and motor torques at each joint, arm fully extended (worst case)</text>

  <g transform="translate(0,-85)">

  <!-- Geometry: J1 (90,190) → link 1 → J2 (270,190) → link 2 → end-effector (440,190) -->

  <!-- Base support under J1 -->
  <polygon points="90,192 78,212 102,212" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="213" x2="110" y2="213" stroke="#475569" stroke-width="2"/>
  <g stroke="#475569" stroke-width="1.2">
    <line x1="72" y1="213" x2="67" y2="219"/><line x1="80" y1="213" x2="75" y2="219"/><line x1="88" y1="213" x2="83" y2="219"/>
    <line x1="96" y1="213" x2="91" y2="219"/><line x1="104" y1="213" x2="99" y2="219"/>
  </g>

  <!-- Links -->
  <rect x="90" y="181" width="180" height="18" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="270" y="183" width="170" height="14" rx="5" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Link 1 (m₁, L₁)</text>
  <text x="355" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#6d28d9">Link 2 (m₂, L₂)</text>

  <!-- Joints -->
  <circle cx="90" cy="190" r="10" fill="white" stroke="#3b82f6" stroke-width="3"/>
  <text x="90" y="193.5" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">J1</text>
  <circle cx="270" cy="190" r="10" fill="white" stroke="#7c3aed" stroke-width="3"/>
  <text x="270" y="193.5" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">J2</text>
  <circle cx="440" cy="190" r="7" fill="#ea580c"/>
  <text x="452" y="186" font-size="9" fill="#c2410c">EE</text>

  <!-- Motor torques (anticlockwise, holding the arm up) -->
  <path d="M 109,184 A 20,20 0 0,0 71,184" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="90" y="160" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">M_J1</text>
  <path d="M 289,184 A 20,20 0 0,0 251,184" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="270" y="160" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">M_J2</text>

  <!-- Weights at each link's centre of gravity, payload at the end -->
  <circle cx="180" cy="190" r="3.5" fill="#dc2626"/>
  <line x1="180" y1="194" x2="180" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="187" y="230" font-size="9" fill="#b91c1c">W₁ = m₁g</text>
  <circle cx="355" cy="190" r="3.5" fill="#dc2626"/>
  <line x1="355" y1="194" x2="355" y2="240" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="362" y="230" font-size="9" fill="#b91c1c">W₂ = m₂g</text>
  <line x1="440" y1="198" x2="440" y2="246" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="448" y="226" font-size="9" fill="#c2410c">F_pay</text>
  <text x="448" y="238" font-size="9" fill="#c2410c">(payload)</text>

  <!-- Reaction force at the base -->
  <line x1="90" y1="256" x2="90" y2="226" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="98" y="248" font-size="9" font-weight="700" fill="#1d4ed8">R_J1</text>
  <text x="40" y="200" text-anchor="middle" font-size="9" fill="#2563eb">Base joint</text>

  <!-- Moment arm of the payload about J1 -->
  <line x1="90" y1="268" x2="440" y2="268" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="90" y1="263" x2="90" y2="273" stroke="#64748b" stroke-width="1"/>
  <line x1="440" y1="263" x2="440" y2="273" stroke="#64748b" stroke-width="1"/>
  <text x="265" y="284" text-anchor="middle" font-size="9" fill="#475569">d_total = L₁ + L₂ (moment arm of the payload about J1)</text>

  <!-- Equations -->
  <rect x="10" y="294" width="500" height="58" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="260" y="309" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b">Static equilibrium equations:</text>
  <text x="20" y="325" font-size="9" fill="#475569">M_J2 = W₂·(L₂/2) + F_pay·L₂</text>
  <text x="20" y="340" font-size="9" fill="#475569">R_J2 = W₂ + F_pay</text>
  <text x="190" y="325" font-size="9" fill="#475569">M_J1 = W₁·(L₁/2) + R_J2·L₁ + M_J2</text>
  <text x="190" y="340" font-size="9" fill="#475569">R_J1 = W₁ + R_J2</text>
  <text x="392" y="325" font-size="9" fill="#2563eb">J1 carries the weight</text>
  <text x="392" y="340" font-size="9" fill="#2563eb">of the whole arm!</text>
  </g>
</svg>
