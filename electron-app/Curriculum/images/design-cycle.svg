<svg viewBox="0 0 480 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr-w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="480" height="500" fill="#f8fafc" rx="8"/>
  <text x="240" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">The Engineering Design Cycle</text>
  <text x="240" y="46" text-anchor="middle" font-size="11" fill="#64748b">Iterative - each loop improves the solution</text>

  <!-- Steps sit on a ring of radius 165 around (240,275), every 60° -->

  <!-- Arrows follow the ring between the step circles (clockwise) -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr-w)">
    <path d="M 292.4,118.5 A 165,165 0 0,1 343.8,146.8"/>
    <path d="M 401.7,242.1 A 165,165 0 0,1 403.0,300.8"/>
    <path d="M 349.3,398.6 A 165,165 0 0,1 299.1,429.0"/>
    <path d="M 187.6,431.5 A 165,165 0 0,1 136.2,403.2"/>
    <path d="M 78.3,307.9 A 165,165 0 0,1 77.0,249.2"/>
    <path d="M 130.7,151.4 A 165,165 0 0,1 180.9,121.0"/>
  </g>

  <!-- Arrow labels, outside the ring at each arrow's midpoint -->
  <text x="340" y="105" text-anchor="middle" font-size="9" fill="#64748b">choose best</text>
  <text x="440" y="278" text-anchor="middle" font-size="9" fill="#64748b">make it</text>
  <text x="340" y="451" text-anchor="middle" font-size="9" fill="#64748b">measure results</text>
  <text x="140" y="451" text-anchor="middle" font-size="9" fill="#64748b">fix problems</text>
  <text x="40" y="278" text-anchor="middle" font-size="9" fill="#64748b">evidence</text>
  <text x="140" y="105" text-anchor="middle" font-size="9" fill="#64748b">next iteration</text>

  <!-- Central circle -->
  <circle cx="240" cy="275" r="52" fill="#1e293b"/>
  <text x="240" y="269" text-anchor="middle" font-size="12" font-weight="700" fill="white">Design</text>
  <text x="240" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#cbd5e1">Cycle</text>
  <text x="240" y="299" text-anchor="middle" font-size="10" fill="#cbd5e1">Repeat to</text>
  <text x="240" y="311" text-anchor="middle" font-size="10" fill="#cbd5e1">converge</text>

  <!-- Step 1: Brief & Specify (top) -->
  <circle cx="240" cy="110" r="46" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="240" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="white">1. Brief &amp;</text>
  <text x="240" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="white">Specify</text>

  <!-- Step 2: Research & Design (top-right) -->
  <circle cx="382.9" cy="192.5" r="46" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="382.9" y="188.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">2. Research</text>
  <text x="382.9" y="202.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">&amp; Design</text>

  <!-- Step 3: Build & Prototype (bottom-right) -->
  <circle cx="382.9" cy="357.5" r="46" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
  <text x="382.9" y="353.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">3. Build &amp;</text>
  <text x="382.9" y="367.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">Prototype</text>

  <!-- Step 4: Test & Evaluate (bottom) -->
  <circle cx="240" cy="440" r="46" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="240" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="white">4. Test &amp;</text>
  <text x="240" y="450" text-anchor="middle" font-size="11" font-weight="700" fill="white">Evaluate</text>

  <!-- Step 5: Improve & Refine (bottom-left) -->
  <circle cx="97.1" cy="357.5" r="46" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="97.1" y="353.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">5. Improve</text>
  <text x="97.1" y="367.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">&amp; Refine</text>

  <!-- Step 6: Document & Present (top-left) -->
  <circle cx="97.1" cy="192.5" r="46" fill="#0369a1" stroke="#075985" stroke-width="2"/>
  <text x="97.1" y="188.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">6. Document</text>
  <text x="97.1" y="202.5" text-anchor="middle" font-size="11" font-weight="700" fill="white">&amp; Present</text>
</svg>
