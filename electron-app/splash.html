<body>

  <!-- Same picture as the Plymouth boot splash (boot-splash.css) -->
  <div class="boot-splash">
    <img class="boot-splash-logo" src="boot-logo.png" alt="Matrix">
    <div class="boot-splash-spinner"></div>
    <p class="boot-splash-status" id="status">Starting robot arm server&hellip;</p>
  </div>

  <script>
    (function () {
      var MAIN_URL   = 'index.html?kiosk=1';
      var WS_URL     = 'ws://127.0.0.1:8080';
      var statusEl   = document.getElementById('status');
      var attempts   = 0;
      var redirecting = false;

      function tryConnect() {
        if (redirecting) return;
        attempts++;

        try {
          var ws = new WebSocket(WS_URL);

          ws.onopen = function () {
            ws.close();
            redirecting = true;
            statusEl.textContent = 'Connected - loading interface…';
            setTimeout(function () {
              window.location.replace(MAIN_URL);
            }, 350);
          };

          ws.onerror = ws.onclose = function () {
            if (redirecting) return;
            var delay = Math.min(400 + attempts * 150, 2000);
            if (attempts === 1) {
              statusEl.textContent = 'Waiting for server…';
            } else {
              statusEl.textContent = 'Waiting for server… (' + attempts + ')';
            }
            setTimeout(tryConnect, delay);
          };
        } catch (e) {
          // WebSocket constructor threw; retry
          setTimeout(tryConnect, 1000);
        }
      }

      // Short delay so the page paints before the first connection attempt
      setTimeout(tryConnect, 250);
    }());
  </script>
</body>
</html>
